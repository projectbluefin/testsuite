e-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a></nav></div></header><main class="container mx-auto px-4 py-8 max-w-7xl flex-grow"><!-- Header --><div class="border-b border-slate-800 pb-6 mb-8"><h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Operational Skills Library</h1><p class="text-sm text-slate-400">Continuous Integration guidelines, AT-SPI accessibility references, and codebase automation runbooks for agents and humans.</p></div><!-- Filters Section --><div class="bg-slate-900 border border-slate-800 rounded-xl p-5 mb-8 flex flex-wrap gap-4 items-center justify-between"><div class="flex items-center gap-3 flex-wrap"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Repository:</span><button class="repo-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold border bg-blue-600 border-blue-500 text-white transition-all duration-200 shadow-glow-blue/10" data-repo="all">All (0)</button><button class="repo-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold border bg-slate-950 border-slate-800 text-slate-400 hover:text-white transition-all duration-200" data-repo="testsuite">testsuite (0)</button><button class="repo-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold border bg-slate-950 border-slate-800 text-slate-400 hover:text-white transition-all duration-200" data-repo="common">common (0)</button></div></div><!-- Skills Cards Grid --><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="skills-grid"></div></main></body></html><script>
  // Filter variables state
  let currentRepo = 'all';
  let activeTags = new Set();

  const repoButtons = document.querySelectorAll('.repo-filter-btn');
  const tagButtons = document.querySelectorAll('.tag-filter-btn');
  const skillCards = document.querySelectorAll('.skill-card');

  // Repo filtering handler
  repoButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      // Toggle button active classes
      repoButtons.forEach(b => {
        b.classList.remove('bg-blue-600', 'border-blue-500', 'text-white');
        b.classList.add('bg-slate-950', 'border-slate-800', 'text-slate-400');
      });
      btn.classList.add('bg-blue-600', 'border-blue-500', 'text-white');
      btn.classList.remove('bg-slate-950', 'border-slate-800', 'text-slate-400');

      currentRepo = btn.dataset.repo;
      filterSkills();
    });
  });

  // Tag filtering handler
  tagButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        btn.classList.remove('bg-brand-glow/10', 'border-brand-glow/30', 'text-brand-glow');
        btn.classList.add('bg-slate-950', 'border-slate-800', 'text-slate-400');
      } else {
        activeTags.add(tag);
        btn.classList.add('bg-brand-glow/10', 'border-brand-glow/30', 'text-brand-glow');
        btn.classList.remove('bg-slate-950', 'border-slate-800', 'text-slate-400');
      }
      filterSkills();
    });
  });

  // Central filtering logic
  function filterSkills() {
    skillCards.forEach(card => {
      const repo = card.dataset.repo;
      const tags = JSON.parse(card.dataset.tags || '[]');

      const matchesRepo = currentRepo === 'all' || repo === currentRepo;
      const matchesTags = activeTags.size === 0 || Array.from(activeTags).every(t => tags.includes(t));

      if (matchesRepo && matchesTags) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  }
</script>
