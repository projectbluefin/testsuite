# Startup-service inventory for the fast hosted QEMU lane (.github/workflows/e2e.yml).
#
# e2e.yml masks units twice before first boot:
#   - kernel_args:        `systemd.mask=<unit>` entries in KERNEL_ARGS
#   - deployment_symlink: `/dev/null` symlinks written into each deployment's
#                         /etc/systemd/system/ by the "Mask CI-irrelevant services"
#                         loop. The loop appends .service/.socket/.path/.timer to
#                         every token, so a bare token `cups` masks cups.socket
#                         and cups.path too, while a dotted token such as
#                         `cups.path` only yields `cups.path.service` and masks
#                         nothing extra.
#
# Every masked unit must have exactly one entry here, and every entry must still
# be masked; tests/unit/test_startup_service_inventory.py enforces both ways.
#
# Categories:
#   startup_contract — a shipped first-boot/update/health path that at least one
#                      profile enables. The fast lane does NOT qualify it; a
#                      representative startup lane must run it (#1025).
#   vm_inapplicable  — needs hardware or a radio that hosted QEMU does not have.
#                      Masking is deliberate and is not a coverage gap.
#   ci_noise         — a shipped background service outside the first-boot
#                      contract, masked only to cut boot time or network use.
#
# Profiles are the image families whose build enables the unit (evidence
# cites the enabling build file). `all` means it is part of the shared base.
#
# startup_lane (startup_contract only) tells the startup-qualification lane
# (.github/workflows/startup-qualification.yml, scripts/startup_lane.py) how to
# judge the unit on a profile that enables it:
#   scope:      system (default) or user — which systemd manager runs it.
#   expect:     completed — ran its condition checks and exited successfully;
#               active    — is running (a daemon) or waiting (a timer);
#               loaded    — shipped, not masked and not failed (started later
#                           by a timer, so not expected to run at boot).
#   deadline_s: seconds after VM start by which the unit must have finished.
#   produces:   paths that must exist once the unit has run.
#   checks:     extra state checks (flatpak: the image's own preinstall,
#               remotes and permission overrides).
#   flatpak_remote: image (default) or installer — who adds the system Flatpak
#               remote. With installer, an image that ships no remotes.d file
#               and has no system remote reports its preinstall refs as not
#               qualified instead of failing them; a shipped or configured
#               remote is still judged in full.
#   deferred:   why the lane cannot qualify it yet. The lane keeps the unit
#               masked and lists it as not qualified; it never passes it.
# vm_inapplicable and ci_noise units stay masked in the startup lane too.

units:
  # --- startup_contract -------------------------------------------------------
  brew-setup.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [bluefin, bluefin-lts, bazzite]
    evidence:
      - ublue-os/bluefin build_files/base/17-cleanup.sh (systemctl enable brew-setup.service)
      - ublue-os/bluefin-lts build_scripts/40-services.sh (systemctl enable brew-setup.service)
      - ublue-os/bazzite Containerfile (systemctl enable brew-setup.service)
    fast_lane_substitute: e2e.yml installs brew CLI tools directly, or falls back to dnf
    blocks: developer brew/bctl/mise scenarios, common ujust changelogs (#487)
    startup_lane:
      expect: completed
      deadline_s: 900
      produces: [/home/linuxbrew/.linuxbrew/bin/brew, /etc/.linuxbrew]

  flatpak-preinstall.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [bluefin, bluefin-lts, aurora, dakota]
    evidence:
      - projectbluefin/common system_files/shared/usr/lib/systemd/system/flatpak-preinstall.service
      - ublue-os/bluefin build_files/base/17-cleanup.sh (systemctl enable flatpak-preinstall.service)
      - ublue-os/aurora system_files/shared/usr/lib/systemd/system-preset/89-aurora.preset
      - projectbluefin/dakota elements/bluefin/firstboot-services.bst (flatpak-preinstall.service.d drop-in) and elements/bluefin/flatpak-apps.bst (preinstall.d)
    fast_lane_substitute: e2e.yml sideloads flatpak-app-list.txt from a runner cache into the system installation
    blocks: smoke flatpak_permissions system-wide installs (x39), common flatpak model/state and services scenarios
    notes: >-
      The image must ship the Flathub remote itself, as a pinned
      /etc/flatpak/remotes.d/flathub.flatpakrepo (projectbluefin/finpilot
      build/10-overlay.sh and projectbluefin/utah scripts/configure-services.sh
      do this): preinstall.d refs install at first boot, before any installer
      or ujust recipe can add one.
    startup_lane:
      expect: completed
      deadline_s: 1800
      checks: [flatpak]

  NetworkManager-wait-online.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [all]
    evidence:
      - flatpak-preinstall.service is ordered After=/Wants=network-online.target, which this unit gates
    fast_lane_substitute: none; network-online.target is reached without waiting for a connection
    blocks: an honest ordering for flatpak-preinstall.service
    startup_lane:
      expect: completed
      deadline_s: 300

  firewalld.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [bluefin-lts]
    evidence:
      - ublue-os/bluefin-lts build_scripts/40-services.sh (systemctl enable firewalld.service)
    fast_lane_substitute: none; firewall state is never observed
    startup_lane:
      expect: active
      deadline_s: 300

  podman-auto-update.service:
    category: startup_contract
    mask_sites: [kernel_args, deployment_symlink]
    profiles: [bluefin, bluefin-lts]
    evidence:
      - ublue-os/bluefin build_files/base/17-cleanup.sh (systemctl --global enable podman-auto-update.timer)
      - ublue-os/bluefin-lts build_scripts/40-services.sh (systemctl --global enable podman-auto-update.timer)
    fast_lane_substitute: none
    notes: >-
      The images enable the user-level timer (--global). Both mask sites target
      the system manager, so the shipped user timer is probably untouched; the
      startup lane must observe the user unit, not assume the mask covers it.
    startup_lane:
      scope: user
      expect: loaded
      deadline_s: 300

  podman-auto-update.timer:
    category: startup_contract
    mask_sites: [kernel_args, deployment_symlink]
    profiles: [bluefin, bluefin-lts]
    evidence:
      - see podman-auto-update.service
    fast_lane_substitute: none
    startup_lane:
      scope: user
      expect: active
      deadline_s: 300

  greenboot-healthcheck.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [bazzite]
    evidence:
      - ublue-os/bazzite Containerfile (systemctl enable greenboot-healthcheck.service)
    fast_lane_substitute: none
    notes: >-
      Automatic rollback needs a real bootloader boot-counting path; the fast
      lane boots a direct kernel, so it cannot stand in for it (#706).
    startup_lane:
      deferred: >-
        needs a bootloader boot-counting path; the startup lane boots a direct
        kernel too, so it keeps this unit masked and reports it unqualified (#706)

  greenboot-set-rollback-trigger.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [bazzite]
    evidence:
      - ublue-os/bazzite Containerfile (systemctl enable greenboot-set-rollback-trigger.service)
    fast_lane_substitute: none
    notes: see greenboot-healthcheck.service
    startup_lane:
      deferred: >-
        needs a bootloader boot-counting path; the startup lane boots a direct
        kernel too, so it keeps this unit masked and reports it unqualified (#706)

  bazzite-hardware-setup.service:
    category: startup_contract
    mask_sites: [kernel_args]
    profiles: [bazzite]
    evidence:
      - ublue-os/bazzite system_files/desktop/shared/usr/lib/systemd/system/bazzite-hardware-setup.service
      - ublue-os/bazzite Containerfile (systemctl enable bazzite-hardware-setup.service)
    fast_lane_substitute: none
    notes: >-
      Runs on every boot, including generic hardware. The startup lane must say
      which of its branches are hardware-specific before treating any as inapplicable.
    startup_lane:
      expect: completed
      deadline_s: 600

  # --- vm_inapplicable --------------------------------------------------------
  wpa_supplicant.service:
    category: vm_inapplicable
    mask_sites: [kernel_args]
    reason: no Wi-Fi device in hosted QEMU; SLIRP user networking only

  bluetooth.service:
    category: vm_inapplicable
    mask_sites: [deployment_symlink]
    reason: no Bluetooth controller in hosted QEMU

  blueman-mechanism.service:
    category: vm_inapplicable
    mask_sites: [kernel_args, deployment_symlink]
    reason: Bluetooth manager helper; no Bluetooth controller in hosted QEMU

  ModemManager.service:
    category: vm_inapplicable
    mask_sites: [deployment_symlink]
    reason: no cellular modem in hosted QEMU

  fwupd.service:
    category: vm_inapplicable
    mask_sites: [deployment_symlink]
    reason: no updatable device firmware in hosted QEMU (bluefin-lts enables it)

  colord.service:
    category: vm_inapplicable
    mask_sites: [deployment_symlink]
    reason: no calibrated display or printer colour profile to manage

  systemd-udev-settle.service:
    category: vm_inapplicable
    mask_sites: [kernel_args]
    reason: times out (~125s) waiting for hardware that QEMU does not present

  # --- ci_noise ---------------------------------------------------------------
  cups.service:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: printing is covered by its own suite, not by first-boot startup

  cups.path:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: see cups.service

  cups.socket:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: see cups.service

  cups.browsed.service:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: network printer discovery; see cups.service
    notes: >-
      Fedora names this unit cups-browsed.service (hyphen). Neither mask site
      matches that name, so the real service is not masked in the fast lane.

  avahi-daemon.service:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: mDNS discovery has no peers on SLIRP networking

  avahi-daemon.socket:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: see avahi-daemon.service

  malcontent-webd.service:
    category: ci_noise
    mask_sites: [kernel_args]
    reason: parental-controls web filter downloads data on boot

  malcontent-webd-update.service:
    category: ci_noise
    mask_sites: [kernel_args]
    reason: see malcontent-webd.service

  malcontent-control.service:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: see malcontent-webd.service

  speech-dispatcherd.service:
    category: ci_noise
    mask_sites: [kernel_args]
    reason: speech synthesis daemon, not part of startup

  gnome-remote-desktop.service:
    category: ci_noise
    mask_sites: [kernel_args, deployment_symlink]
    reason: remote desktop server, not part of startup
