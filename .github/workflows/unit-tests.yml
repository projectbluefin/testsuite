# Unit Tests — pytest
#
# Runs on every PR and push to main. Lightweight — no VM or cluster needed.
# Validates syntax, structure, and logic of Python helpers that can be
# tested without a live VM.

name: Unit Tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install coverage pytest pytest-xdist behave selenium pyyaml
        # selenium is required to import tests/shared/kde_webdriver.py,
        # which wraps the W3C WebDriver client for KDE's AT-SPI bridge.
        # pyyaml is required to import scripts/validate_docs.py (frontmatter
        # parsing), which tests/unit/test_validate_docs.py imports directly.

      - name: Install just
        # Pinned binary so tests/unit/test_justfile_results.py's Justfile
        # contract tests run here instead of skipping on a bare image.
        # Bump deliberately (Renovate does not track this URL).
        run: |
          curl -sSfL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 755 /tmp/just /usr/local/bin/just
          just --version

      - name: Run unit tests
        env:
          COVERAGE_PROCESS_START: .coveragerc
        run: |
          coverage erase
          coverage run -m pytest -n auto tests/unit/ -v
          coverage combine
          coverage xml
          coverage report --fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
