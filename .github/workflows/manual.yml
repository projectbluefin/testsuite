# Manual test trigger — run any suite against any bootc image from the
# Actions UI. No self-hosted runners required.
#
# Supported suites: smoke, developer, dx, software, vanilla-gnome, bazzite, lifecycle

name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full OCI image reference (e.g. ghcr.io/projectbluefin/bluefin:latest)"
        required: true
        default: "ghcr.io/projectbluefin/bluefin:latest"
      suites:
        description: "Comma-separated suites: smoke,developer,dx,software,vanilla-gnome,bazzite,lifecycle"
        required: true
        default: "smoke"
      chunked_enabled:
        description: "Enable @zstd_chunked scenarios in the lifecycle suite"
        required: false
        default: "false"
      selinux_enforcing:
        description: "Boot the guest SELinux enforcing and run the AVC denial gate (#1024)"
        required: false
        default: "false"
      test_ref:
        description: "Git ref for tests/ checkout (default: dispatched branch; set to override)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ github.event.inputs.image }}
      suites: ${{ github.event.inputs.suites }}
      chunked_enabled: ${{ github.event.inputs.chunked_enabled == 'true' }}
      selinux_enforcing: ${{ github.event.inputs.selinux_enforcing == 'true' }}
      # workflow_dispatch sees the branch selected in the Actions UI. Keep
      # branch resolution here; github.ref_name inside e2e.yml resolves to main.
      test_ref: ${{ github.event.inputs.test_ref || github.ref_name }}
      # Fork dispatches must check out the selected ref from the fork rather
      # than looking for that branch in projectbluefin/testsuite.
      test_repository: ${{ github.repository }}
