name: GNOME OS desktop canary

# Explicit experiment only. Does not install or validate candidate extensions.
on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Commit SHA or ref to test, for example a pull request head; empty means the dispatched commit."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      test_ref:
        description: "Commit SHA or ref to test, for example a pull request head; empty means the dispatched commit."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  canary:
    # Pinned: on ubuntu-26.04 (ubuntu-latest since 2026-11-09) bootc's
    # loopback install stops with "root partition 3 has type <none>"; the
    # same image installs on 24.04 (#1123). Lift once it works on 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.test_ref || github.sha }}
          persist-credentials: false

      - name: Free disk space
        uses: projectbluefin/actions/bootc-build/setup-runner@46001bf923f11eab3a88fe1cf4540debb050516c # v1
        with:
          update-podman: "false"

      - name: Build native harness over pinned official GNOME OS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends skopeo
          sudo bash scripts/build-gnomeos-harness.sh results
          sudo chown -R "$(id -u):$(id -g)" results

      - name: Boot GNOME OS and exercise real input and accessibility
        uses: ./.github/actions/gnome-e2e
        with:
          image: localhost/gnomeos-harness:canary
          suite: gnomeos-canary
          testsuite-ref: ${{ steps.checkout.outputs.commit }}
          free-disk-space: 'false'

      - name: Collect guest journal and stop VM
        if: always()
        run: |
          mkdir -p results
          if [[ -f /tmp/gnome_e2e_key ]]; then
            ssh -i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ConnectTimeout=5 -p 2222 bluefin-test@127.0.0.1 \
              'sudo journalctl -b --no-pager' > results/guest-journal.txt 2>&1 || true
            ssh -i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ConnectTimeout=5 -p 2222 bluefin-test@127.0.0.1 \
              'cat /opt/gnomeos-harness/packages.txt' > results/harness-packages.txt 2>&1 || true
          fi
          if [[ -f /tmp/gnome_e2e_qemu.pid ]]; then
            # QEMU runs as root, so the pidfile is root-owned; read it with
            # sudo (as the boot message does) or cleanup aborts on "Permission
            # denied" before the process is signalled (#1144).
            sudo kill "$(sudo cat /tmp/gnome_e2e_qemu.pid)" || true
          fi
          sudo chown -R "$(id -u):$(id -g)" results

      - name: Retain provenance, provisioning and desktop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gnomeos-desktop-canary
          path: |
            results/
            bootc-install.log
            vm-serial.log
          if-no-files-found: error
