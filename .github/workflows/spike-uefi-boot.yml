# Spike: UEFI boot via OVMF + bootc --bootloader systemd
#
# Proves that a GHA ubuntu-latest runner can:
#   1. Run `bootc install to-disk --bootloader systemd` on a ublue image
#   2. Boot the resulting disk via OVMF pflash QEMU (no -kernel/-initrd)
#   3. SSH in, run `bootc switch`, reboot, and confirm the new image is active
#
# This is a throw-away spike workflow for issue #229.
# Once validated, the UEFI boot path will be integrated into e2e.yml.

name: "Spike: UEFI Boot (OVMF)"

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Source OCI image to install to disk"
        required: true
        default: "ghcr.io/ublue-os/bluefin:stable"
      target_image:
        description: "Target OCI image to bootc switch to"
        required: true
        default: "ghcr.io/projectbluefin/bluefin:stable"

permissions:
  contents: read

jobs:
  uefi-boot:
    name: UEFI boot spike
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SOURCE_IMAGE: ${{ inputs.source_image }}
      TARGET_IMAGE: ${{ inputs.target_image }}
      SSH_OPTS: "-i /tmp/vm_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=3"
      # Timeouts (seconds)
      SSH_DEADLINE_S: 600
      BOOTC_SWITCH_TIMEOUT_S: 900
      REBOOT_DEADLINE_S: 300

    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Install QEMU + OVMF and pull source image
        run: |
          sudo podman pull "${SOURCE_IMAGE}" &
          PULL_PID=$!
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          wait $PULL_PID

          echo "=== OVMF files available ==="
          find /usr/share/OVMF -type f -name '*.fd' | sort
          ls -lh /usr/share/OVMF/OVMF_CODE*.fd /usr/share/OVMF/OVMF_VARS*.fd 2>/dev/null || true

          echo "=== QEMU version ==="
          qemu-system-x86_64 --version

      - name: Generate SSH keypair
        run: |
          ssh-keygen -t ed25519 -f /tmp/vm_key -N "" -C "spike-uefi@gha"

      - name: Install OCI image to disk
        run: |
          fallocate -l 30G disk.raw

          # Probe --bootloader support
          BOOTLOADER_FLAG=""
          if sudo podman run --rm --quiet "${SOURCE_IMAGE}" bootc install to-disk --help 2>&1 | grep -q "\-\-bootloader"; then
            BOOTLOADER_FLAG="--bootloader systemd"
            echo "bootc supports --bootloader flag"
          else
            echo "WARNING: bootc does NOT support --bootloader flag"
          fi

          sudo podman run \
            --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v /dev:/dev \
            -v "$(pwd):/data" \
            "${SOURCE_IMAGE}" bootc install to-disk \
              --via-loopback /data/disk.raw \
              --filesystem ext4 \
              --wipe \
              ${BOOTLOADER_FLAG} \
            || echo "bootc install exited $? — checking if deployment was written"

          echo "=== Disk partition layout ==="
          sudo fdisk -l disk.raw || true

      - name: Inspect disk layout and BLS entries
        run: |
          LOOP=$(sudo losetup -f --show -P disk.raw)
          echo "Loop: ${LOOP}"

          echo "=== Partitions ==="
          lsblk "${LOOP}" || true
          for p in ${LOOP}p*; do
            echo "${p}: $(sudo blkid "${p}" 2>/dev/null || echo 'no blkid')"
          done

          # Mount ESP (p2) and inspect
          echo ""
          echo "=== ESP (p2) contents ==="
          sudo mkdir -p /mnt/esp
          if sudo mount "${LOOP}p2" /mnt/esp 2>/dev/null; then
            sudo find /mnt/esp -type f | sort
            echo ""
            echo "=== BLS entries in ESP ==="
            sudo find /mnt/esp -name '*.conf' -exec echo "--- {} ---" \; -exec cat {} \;
            echo ""
            echo "=== loader.conf ==="
            sudo cat /mnt/esp/loader/loader.conf 2>/dev/null || echo "(not found)"
            echo ""
            echo "=== EFI bootloader binaries ==="
            sudo find /mnt/esp/EFI -type f 2>/dev/null | sort || echo "(none)"
            sudo umount /mnt/esp
          else
            echo "Could not mount p2 as ESP"
          fi

          # Check if there's a separate /boot partition (p3 might be xbootldr)
          echo ""
          echo "=== Checking all partitions for BLS entries ==="
          for p in ${LOOP}p*; do
            sudo mkdir -p /mnt/check
            if sudo mount "${p}" /mnt/check 2>/dev/null; then
              BLS_FILES=$(sudo find /mnt/check -name '*.conf' -path '*/loader/entries/*' 2>/dev/null)
              if [[ -n "${BLS_FILES}" ]]; then
                echo "Found BLS entries on ${p}:"
                echo "${BLS_FILES}"
                for f in ${BLS_FILES}; do
                  echo "--- ${f} ---"
                  sudo cat "${f}"
                done
              fi
              sudo umount /mnt/check
            fi
          done

          # Mount root and inspect ostree deployment
          echo ""
          echo "=== Root (p3) ostree deployment ==="
          sudo mkdir -p /mnt/root
          sudo mount "${LOOP}p3" /mnt/root
          DEPLOY=$(sudo ls /mnt/root/ostree/deploy/default/deploy/ 2>/dev/null | head -1)
          if [[ -z "${DEPLOY}" ]]; then
            echo "ERROR: no ostree deployment found"
            sudo ls -la /mnt/root/ || true
            sudo losetup -d "${LOOP}"
            exit 1
          fi
          D="/mnt/root/ostree/deploy/default/deploy/${DEPLOY}"
          echo "Deployment: ${DEPLOY}"
          KVER=$(ls "${D}/usr/lib/modules/" | head -1)
          echo "Kernel: ${KVER}"

          echo "LOOP=${LOOP}" >> "$GITHUB_ENV"
          echo "DEPLOY=${DEPLOY}" >> "$GITHUB_ENV"
          echo "KVER=${KVER}" >> "$GITHUB_ENV"

      - name: Configure disk for CI (sshd, user, autologin)
        run: |
          D="/mnt/root/ostree/deploy/default/deploy/${DEPLOY}"
          VAR="/mnt/root/ostree/deploy/default/var"
          BFT_UID=1001

          for DEP in $(sudo find /mnt/root/ostree/deploy/default/deploy \
              -maxdepth 1 -mindepth 1 -type d 2>/dev/null); do

            # Enable sshd
            sudo mkdir -p "${DEP}/etc/systemd/system/multi-user.target.wants/"
            sudo ln -sf /usr/lib/systemd/system/sshd.service \
              "${DEP}/etc/systemd/system/multi-user.target.wants/sshd.service"

            # Pre-generate SSH host keys
            sudo ssh-keygen -A -f "${DEP}" 2>/dev/null || true

            # Create bluefin-test user
            if ! sudo grep -q '^bluefin-test:' "${DEP}/etc/passwd" 2>/dev/null; then
              printf 'bluefin-test:x:%d:%d:Bluefin Test:/var/home/bluefin-test:/bin/bash\n' \
                "${BFT_UID}" "${BFT_UID}" | sudo tee -a "${DEP}/etc/passwd"
              printf 'bluefin-test:*:19000:0:99999:7:::\n' | sudo tee -a "${DEP}/etc/shadow"
              printf 'bluefin-test:x:%d:\n' "${BFT_UID}" | sudo tee -a "${DEP}/etc/group"
            fi

            # Sudo access
            sudo mkdir -p "${DEP}/etc/sudoers.d"
            printf 'bluefin-test ALL=(ALL) NOPASSWD: ALL\n' | \
              sudo tee "${DEP}/etc/sudoers.d/bluefin-test"

            # SSH authorized key via sshd AuthorizedKeysCommand
            sudo mkdir -p "${DEP}/etc/ssh/sshd_config.d"
            cat <<'SSHEOF' | sudo tee "${DEP}/etc/ssh/sshd_config.d/00-ci-auth.conf"
          AuthorizedKeysFile none
          AuthorizedKeysCommand /usr/bin/cat /etc/ssh/ci-authorized-keys
          AuthorizedKeysCommandUser root
          SSHEOF
            sudo cp /tmp/vm_key.pub "${DEP}/etc/ssh/ci-authorized-keys"
            sudo chown root:root "${DEP}/etc/ssh/ci-authorized-keys"
            sudo chmod 644 "${DEP}/etc/ssh/ci-authorized-keys"
          done

          # Home directory with authorized_keys
          sudo mkdir -p "${VAR}/home/bluefin-test/.ssh"
          sudo cp /tmp/vm_key.pub "${VAR}/home/bluefin-test/.ssh/authorized_keys"
          sudo chown -R ${BFT_UID}:${BFT_UID} "${VAR}/home/bluefin-test"
          sudo chmod 700 "${VAR}/home/bluefin-test/.ssh"
          sudo chmod 600 "${VAR}/home/bluefin-test/.ssh/authorized_keys"

          sudo umount /mnt/root

      - name: Prepare OVMF pflash vars
        run: |
          # OVMF needs a writable copy of VARS; CODE is read-only.
          # Try 4M variant first (needed for some Fedora kernels), fall back to standard.
          if [[ -f /usr/share/OVMF/OVMF_CODE_4M.fd ]]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.fd"
            cp /usr/share/OVMF/OVMF_VARS_4M.fd ./OVMF_VARS.fd
            echo "Using 4M OVMF variant"
          elif [[ -f /usr/share/OVMF/OVMF_CODE_4M.ms.fd ]]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE_4M.ms.fd"
            cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd ./OVMF_VARS.fd
            echo "Using 4M MS OVMF variant"
          elif [[ -f /usr/share/OVMF/OVMF_CODE.fd ]]; then
            OVMF_CODE="/usr/share/OVMF/OVMF_CODE.fd"
            cp /usr/share/OVMF/OVMF_VARS.fd ./OVMF_VARS.fd
            echo "Using standard OVMF variant"
          else
            echo "ERROR: No OVMF firmware found"
            find /usr/share -name 'OVMF*' -o -name 'edk2*' 2>/dev/null
            exit 1
          fi
          echo "OVMF_CODE=${OVMF_CODE}" >> "$GITHUB_ENV"
          chmod 644 ./OVMF_VARS.fd
          ls -lh "${OVMF_CODE}" ./OVMF_VARS.fd

      - name: Boot VM via OVMF UEFI
        run: |
          sudo losetup -d "${LOOP}" 2>/dev/null || true

          touch "$(pwd)/vm-serial.log"
          chmod 666 "$(pwd)/vm-serial.log"

          # UEFI boot: no -kernel/-initrd/-append.
          # OVMF scans the ESP for EFI/BOOT/BOOTX64.EFI (systemd-boot fallback path).
          # systemd-boot then reads loader/entries/*.conf BLS entries.
          sudo qemu-system-x86_64 \
            -machine  q35,accel=kvm \
            -cpu      host \
            -m        4096 \
            -smp      4 \
            -drive    if=pflash,format=raw,readonly=on,file="${OVMF_CODE}" \
            -drive    if=pflash,format=raw,file=./OVMF_VARS.fd \
            -object   iothread,id=ioth0 \
            -drive    if=none,id=disk,file=disk.raw,format=raw,cache=unsafe,aio=threads,discard=unmap \
            -device   virtio-blk-pci,drive=disk,iothread=ioth0 \
            -netdev   user,id=net0,hostfwd=tcp::2222-:22 \
            -device   virtio-net-pci,netdev=net0 \
            -device   virtio-gpu-pci \
            -display  none \
            -serial   file:$(pwd)/vm-serial.log \
            -daemonize \
            -pidfile  /tmp/qemu.pid
          echo "VM booting via UEFI (pid=$(sudo cat /tmp/qemu.pid))"

      - name: Wait for SSH
        run: |
          DEADLINE=$((SECONDS + SSH_DEADLINE_S))
          while [ $SECONDS -lt $DEADLINE ]; do
            if ssh ${SSH_OPTS} -p 2222 bluefin-test@127.0.0.1 "echo up" 2>/dev/null; then
              echo "SSH ready after ${SECONDS}s"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: SSH not ready after ${SSH_DEADLINE_S}s"
          echo "=== Last 100 lines of serial log ==="
          tail -100 "$(pwd)/vm-serial.log" 2>/dev/null || echo "(no serial log)"
          exit 1

      - name: Validate initial boot state
        run: |
          SSH="ssh ${SSH_OPTS} -p 2222 bluefin-test@127.0.0.1"
          echo "=== Q1: Does getenforce work? ==="
          $SSH "getenforce" || echo "(getenforce not available)"

          echo ""
          echo "=== Boot method validation ==="
          $SSH "cat /proc/cmdline"

          echo ""
          echo "=== Is this UEFI? ==="
          $SSH "test -d /sys/firmware/efi && echo 'UEFI boot confirmed' || echo 'BIOS/legacy boot'"

          echo ""
          echo "=== bootc status (source image) ==="
          $SSH "sudo bootc status" || echo "(bootc status failed)"

          echo ""
          echo "=== systemd-boot entries ==="
          $SSH "sudo bootctl list" 2>/dev/null || echo "(bootctl not available or not UEFI)"

          echo ""
          echo "=== OS release ==="
          $SSH "cat /etc/os-release"

      - name: Run bootc switch to target image
        run: |
          SSH="ssh ${SSH_OPTS} -p 2222 bluefin-test@127.0.0.1"
          echo "Switching from ${SOURCE_IMAGE} to ${TARGET_IMAGE}..."
          timeout ${BOOTC_SWITCH_TIMEOUT_S} $SSH "sudo bootc switch '${TARGET_IMAGE}'" 2>&1
          echo "bootc switch completed"

          echo ""
          echo "=== bootc status after switch ==="
          $SSH "sudo bootc status"

          echo ""
          echo "=== BLS entries after switch ==="
          $SSH "sudo bootctl list" 2>/dev/null || echo "(bootctl list failed)"

      - name: Reboot VM and wait for SSH
        run: |
          SSH="ssh ${SSH_OPTS} -p 2222 bluefin-test@127.0.0.1"
          echo "Rebooting VM..."
          # reboot returns non-zero and drops the connection; ignore errors
          $SSH "sudo reboot" 2>/dev/null || true

          # Wait for SSH to go down
          sleep 10

          # Wait for SSH to come back up after reboot
          DEADLINE=$((SECONDS + REBOOT_DEADLINE_S))
          while [ $SECONDS -lt $DEADLINE ]; do
            if ssh ${SSH_OPTS} -p 2222 bluefin-test@127.0.0.1 "echo up" 2>/dev/null; then
              echo "SSH ready after reboot (${SECONDS}s)"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: SSH not ready after reboot within ${REBOOT_DEADLINE_S}s"
          echo "=== Last 100 lines of serial log ==="
          tail -100 "$(pwd)/vm-serial.log" 2>/dev/null || echo "(no serial log)"
          exit 1

      - name: Validate post-reboot state
        run: |
          SSH="ssh ${SSH_OPTS} -p 2222 bluefin-test@127.0.0.1"
          echo "=== Q5: Is the new deployment active after reboot? ==="
          $SSH "sudo bootc status"

          echo ""
          echo "=== Booted image ==="
          BOOTED_IMAGE=$($SSH "sudo bootc status --json" 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          spec = data.get('status', {}).get('booted', {}).get('image', {})
          transport = spec.get('transport', '')
          image = spec.get('image', '')
          print(f'{transport}:{image}' if transport else image)
          " 2>/dev/null || echo "PARSE_FAILED")
          echo "Booted image: ${BOOTED_IMAGE}"

          echo ""
          echo "=== Boot method still UEFI? ==="
          $SSH "test -d /sys/firmware/efi && echo 'UEFI boot confirmed' || echo 'BIOS/legacy boot'"

          echo ""
          echo "=== Kernel cmdline after reboot ==="
          $SSH "cat /proc/cmdline"

          echo ""
          echo "=== OS release after reboot ==="
          $SSH "cat /etc/os-release"

          echo ""
          echo "=== systemd-boot entries after reboot ==="
          $SSH "sudo bootctl list" 2>/dev/null || echo "(bootctl list failed)"

          # Final assertion: the booted image should contain the target
          if echo "${BOOTED_IMAGE}" | grep -q "projectbluefin/bluefin"; then
            echo ""
            echo "SUCCESS: VM booted into the target image after bootc switch + reboot"
          else
            echo ""
            echo "FAILURE: VM did not boot into the expected target image"
            echo "Expected: ${TARGET_IMAGE}"
            echo "Got: ${BOOTED_IMAGE}"
            exit 1
          fi

      - name: Dump serial log
        if: always()
        run: |
          echo "=== Full VM serial log ==="
          cat "$(pwd)/vm-serial.log" 2>/dev/null || echo "(no serial log)"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spike-uefi-serial-log
          path: vm-serial.log
          retention-days: 7
