# Move the v1 tag after a merge to main, behind a VM gate (testsuite#1027)
#
# Consumers call e2e.yml@v1, and e2e.yml checks out its tests at v1 by
# default, so v1 is what every image repo runs. On each push to main this
# workflow plans which suites the not-yet-distributed range (v1..main) needs
# (scripts/vm_validation_plan.py), boots them through e2e.yml at the merged SHA
# against a digest-pinned image, and moves v1 only when they pass. e2e.yml's
# own fail-closed verdict (scripts/assert_passed.py, #1022) decides "pass".
#
# The gate catches testsuite changes that break the suites, not bugs in the
# image under test. When the candidate fails, the same suites boot again with
# the tests at the current v1 on the same digest (the baseline), and
# scripts/v1_gate_compare.py moves v1 only if every candidate failure also
# fails at v1. Anything it cannot explain holds v1.
#
# The range starts at v1, not at the push's previous commit: if a newer push
# cancels a gated run, the next run still covers the cancelled change.
#
# A held v1 is never silent: the run fails and an issue titled
# "v1 tag held by the post-merge VM gate" names the held SHA. The next
# successful move closes it.
#
# Emergency path: run this workflow by hand on main with force=true to move v1
# to main without booting. The run summary records who forced it and why.
#
# Security: only merged main code runs here (push to main or a manual run
# on main). The VM jobs get contents:read and packages:write, as every
# e2e.yml caller does; only the final job can write the tag and issues.

name: Update v1 tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Move v1 to main without the VM gate (emergency only)"
        type: boolean
        default: false
      reason:
        description: "Why the gate is being skipped (recorded in the run summary)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: update-v1-tag
  cancel-in-progress: true

env:
  # Image the gate boots. Resolved to a digest at plan time so the run records
  # exactly what it tested. Override with the V1_GATE_IMAGE repository variable.
  # dakota:testing is what Dakota publishes now; dakota:latest stopped in June.
  GATE_IMAGE: ${{ vars.V1_GATE_IMAGE || 'ghcr.io/projectbluefin/dakota:testing' }}

jobs:
  plan:
    name: Plan v1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
      action: ${{ steps.plan.outputs.action }}
      suites: ${{ steps.plan.outputs.suites }}
      ungated: ${{ steps.plan.outputs.ungated }}
      reason: ${{ steps.plan.outputs.reason }}
      image: ${{ steps.image.outputs.image }}
      baseline_image: ${{ steps.image.outputs.baseline_image }}
    steps:
      - name: Refuse manual runs off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Run this workflow on main, not ${REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          PREVIOUS=$(git rev-parse -q --verify 'refs/tags/v1^{commit}' || true)
          {
            echo "sha=${SHA}"
            echo "previous=${PREVIOUS}"
          } >> "$GITHUB_OUTPUT"

          if [ "${PREVIOUS}" = "${SHA}" ]; then
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "v1 already points to ${SHA::7}; nothing to do."
            exit 0
          fi
          if [ "${FORCE}" = "true" ]; then
            echo "action=move" >> "$GITHUB_OUTPUT"
            echo "reason=forced by a manual run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${PREVIOUS}" ] && git merge-base --is-ancestor "${PREVIOUS}" "${SHA}"; then
            git diff --name-only "${PREVIOUS}" "${SHA}" > changed.txt
          else
            # No v1 yet, or v1 is not behind main: plan the full set (fail-closed).
            echo "unknown-base" > changed.txt
          fi
          python3 scripts/vm_validation_plan.py < changed.txt > plan.json
          python3 scripts/v1_gate.py < plan.json | tee -a "$GITHUB_OUTPUT"

          {
            echo "### v1 gate plan"
            echo
            echo "Range: \`${PREVIOUS:-none}\` → \`${SHA}\`"
            echo
            echo '```json'
            cat plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin the gate image by digest
        id: image
        if: steps.plan.outputs.action == 'gate'
        run: |
          set -euo pipefail
          NAME="${GATE_IMAGE%@*}"
          LAST="${NAME##*/}"
          if [[ "${LAST}" == *:* ]]; then REPO="${NAME%:*}"; else REPO="${NAME}"; NAME="${NAME}:latest"; fi
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${NAME}")
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::Could not resolve a digest for ${NAME}"; exit 1 ;;
          esac
          # Same digest, spelled without the tag for the baseline run, so the two
          # runs' e2e.yml artifact names (derived from the image string) differ.
          {
            echo "image=${NAME}@${DIGEST}"
            echo "baseline_image=${REPO}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Gate image: \`${NAME}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Boot merged tests
    needs: plan
    if: needs.plan.outputs.action == 'gate'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.plan.outputs.image }}
      suites: ${{ needs.plan.outputs.suites }}
      test_ref: ${{ needs.plan.outputs.sha }}
      test_repository: ${{ github.repository }}

  baseline:
    name: Boot v1 tests (baseline)
    needs: [plan, gate]
    if: >-
      always() && !cancelled() &&
      needs.plan.outputs.action == 'gate' && needs.gate.result == 'failure' &&
      needs.plan.outputs.previous != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.plan.outputs.baseline_image }}
      suites: ${{ needs.plan.outputs.suites }}
      test_ref: ${{ needs.plan.outputs.previous }}
      test_repository: ${{ github.repository }}

  publish:
    name: Move or hold v1
    needs: [plan, gate, baseline]
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' && needs.plan.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      ACTION: ${{ needs.plan.outputs.action }}
      GATE_RESULT: ${{ needs.gate.result }}
      BASELINE_RESULT: ${{ needs.baseline.result }}
      SUITES: ${{ needs.plan.outputs.suites }}
      UNGATED: ${{ needs.plan.outputs.ungated }}
      REASON: ${{ needs.plan.outputs.reason }}
      IMAGE: ${{ needs.plan.outputs.image }}
      BASELINE_IMAGE: ${{ needs.plan.outputs.baseline_image }}
      FORCE_REASON: ${{ inputs.reason }}
      ACTOR: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HELD_TITLE: v1 tag held by the post-merge VM gate
    steps:
      - name: Checkout the comparison script
        if: env.GATE_RESULT == 'failure' && (env.BASELINE_RESULT == 'success' || env.BASELINE_RESULT == 'failure')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/v1_gate_compare.py
          sparse-checkout-cone-mode: false

      - name: Download candidate and baseline results
        if: env.GATE_RESULT == 'failure' && (env.BASELINE_RESULT == 'success' || env.BASELINE_RESULT == 'failure')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: e2e-*
          path: artifacts

      - name: Compare candidate failures with v1
        id: compare
        if: env.GATE_RESULT == 'failure' && (env.BASELINE_RESULT == 'success' || env.BASELINE_RESULT == 'failure')
        run: |
          set -euo pipefail
          python3 scripts/v1_gate_compare.py artifacts "${IMAGE}" "${BASELINE_IMAGE}" \
            --summary compare.md | tee -a "$GITHUB_OUTPUT"
          cat compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Move or hold v1
        env:
          COMPARE: ${{ steps.compare.outputs.verdict }}
        run: |
          set -euo pipefail
          HELD=$(gh issue list --state open --search "\"${HELD_TITLE}\" in:title" \
            --json number,title --jq "[.[] | select(.title == env.HELD_TITLE)][0].number // empty")

          if [ "${ACTION}" = "move" ] || { [ "${ACTION}" = "gate" ] && [ "${GATE_RESULT}" = "success" ]; }; then
            :
          elif [ "${ACTION}" = "gate" ] && [ "${COMPARE}" = "move" ]; then
            REASON="${REASON}; every candidate failure also fails at v1 (see the comparison in this run's summary)"
          else
            MOVE=no
          fi

          if [ "${MOVE:-yes}" = "yes" ]; then
            if [ -n "${PREVIOUS}" ]; then
              gh api -X PATCH "repos/${REPO}/git/refs/tags/v1" -f sha="${SHA}" -F force=true > /dev/null
            else
              gh api -X POST "repos/${REPO}/git/refs" -f ref=refs/tags/v1 -f sha="${SHA}" > /dev/null
            fi
            {
              echo "### v1 moved"
              echo
              echo "\`${PREVIOUS:-none}\` → \`${SHA}\`: ${REASON}"
              if [ -n "${IMAGE}" ]; then echo; echo "Booted \`${SUITES}\` on \`${IMAGE}\`."; fi
              if [ -n "${UNGATED}" ]; then echo; echo "Not booted (no second image yet, #706): \`${UNGATED}\`."; fi
              if [ -n "${FORCE_REASON}" ]; then echo; echo "Forced by @${ACTOR}: ${FORCE_REASON}"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${HELD}" ]; then
              gh issue close "${HELD}" --comment "v1 moved to ${SHA} (${RUN_URL}); the hold is cleared."
            fi
            exit 0
          fi

          if [ "${ACTION}" = "gate" ] && [ -s compare.md ]; then
            WHY="the VM gate found failures v1 does not explain (suites: ${SUITES}; image: ${IMAGE}). $(sed -n '/^\*\*Not explained by v1:\*\*/,/^$/p' compare.md | { grep -E '^- ' || true; } | head -20 | tr '\n' ' ')"
          elif [ "${ACTION}" = "gate" ]; then
            WHY="the VM gate did not pass (e2e.yml result: ${GATE_RESULT}; baseline: ${BASELINE_RESULT:-not run}; suites: ${SUITES}; image: ${IMAGE})"
          else
            WHY="${REASON}"
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "v1 stays at \`${PREVIOUS:-none}\` and was **not** moved to \`${SHA}\`." \
            "Why: ${WHY}." \
            "Run: ${RUN_URL}" \
            "To release it: fix main (the next push re-runs the gate), or after validating by hand run **Update v1 tag** on main with \`force\` and a reason.")
          if [ -n "${HELD}" ]; then
            gh issue comment "${HELD}" --body "${BODY}"
          else
            gh issue create --title "${HELD_TITLE}" --body "${BODY}"
          fi
          {
            echo "### v1 held at \`${PREVIOUS:-none}\`"
            echo
            echo "${WHY}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::v1 held at ${PREVIOUS:-none}: ${WHY}"
          exit 1
