name: Publish QA Dashboard & Screenshots to Pages

# Runs on a schedule to pull test runs and screenshots from GHCR,
# converts Behave JSONs to dashboard schemas, compiles Astro, and deploys.
on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours; covers nightly (02:00 UTC) and post-merge runs
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dashboard Code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Existing Screenshots (gh-pages)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: old-gh-pages
          fetch-depth: 1

      - name: Set up Python Environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install ORAS CLI
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Pull screenshots and run logs from GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p scratch/ dashboard/src/data/runs/ dashboard/public/screenshots/

          REGISTRY="ghcr.io/projectbluefin/testsuite/desktop-screenshot"
          
          # Known image slugs to sync
          SLUGS=(
            bluefin-testing
            bluefin-lts-testing
            dakota-testing
          )
          SUITES=(smoke common vanilla-gnome)
          DATE=$(date -u +%Y%m%d)

          for SLUG in "${SLUGS[@]}"; do
            for SUITE in "${SUITES[@]}"; do
              TAG="${SLUG}-${SUITE}-latest"
              SHOT_DIR="scratch/${SLUG}/${SUITE}"
              mkdir -p "$SHOT_DIR"

              if oras pull "${REGISTRY}:${TAG}" -o "$SHOT_DIR/" 2>/dev/null; then
                # 1. Capture Desktop Screenshot
                SHOT=$(find "$SHOT_DIR/" -name "*.png" | head -1)
                if [[ -n "$SHOT" ]]; then
                  cp "$SHOT" "dashboard/public/screenshots/${TAG}.png"
                  echo "Downloaded screenshot: dashboard/public/screenshots/${TAG}.png"
                fi

                # 2. Extract Run Metadata & Convert Behave JSON
                BEHAVE_JSON=$(find "$SHOT_DIR/" -name "results.json" | head -1)
                if [[ -f "$BEHAVE_JSON" ]]; then
                  # Fetch manifest to read run ID and caller repo annotations
                  MANIFEST=$(oras manifest fetch "${REGISTRY}:${TAG}" 2>/dev/null || echo "{}")
                  RUN_ID=$(echo "$MANIFEST" | jq -r '.annotations["io.github.projectbluefin.run_id"] // ""')
                  CALLER=$(echo "$MANIFEST" | jq -r '.annotations["io.github.projectbluefin.caller_repo"] // ""')
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

                  python3 dashboard/scripts/convert_behave.py \
                    "$BEHAVE_JSON" \
                    "$RUN_ID" \
                    "$CALLER" \
                    "$SLUG" \
                    "$SUITE" \
                    "$TIMESTAMP" \
                    "dashboard/src/data/runs/"
                fi
              fi
            done
          done

      - name: Copy existing historical runs if available
        continue-on-error: true
        run: |
          if [ -d "old-gh-pages/data" ]; then
            # If we had JSON files in old-gh-pages, copy them over
            cp -r old-gh-pages/data/*.json dashboard/src/data/runs/ 2>/dev/null || true
          fi

      - name: Compile Rollup Data Index
        run: |
          python3 dashboard/scripts/compile_data.py

      - name: Set up Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Dashboard & Index Search
        run: |
          cd dashboard
          npm run build

      - name: Stitch Historical Assets
        run: |
          # Create screenshots folder inside compiled bundle
          mkdir -p dashboard/dist/screenshots
          
          # 1. Copy old screenshots from gh-pages branch
          if [ -d "old-gh-pages/screenshots" ]; then
            cp -r old-gh-pages/screenshots/*.png dashboard/dist/screenshots/ 2>/dev/null || true
          fi
          
          # 2. Copy newly pulled screenshots
          cp -r dashboard/public/screenshots/*.png dashboard/dist/screenshots/ 2>/dev/null || true

          # 3. Archive raw run results for future incremental builds
          mkdir -p dashboard/dist/data
          cp -r dashboard/src/data/runs dashboard/dist/data/

      - name: Generate Coverage Badges
        run: |
          python3 scripts/generate_badges.py --repo-root . --output-dir dashboard/dist/badges

      - name: Deploy Compiled Dashboard to gh-pages Branch
        run: |
          cd old-gh-pages
          
          # Remove everything except the .git directory
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' -exec rm -rf {} +
          
          # Copy all compiled static files from dashboard/dist
          cp -r ../dashboard/dist/* .
          
          # Disable Jekyll on GitHub Pages to serve _astro folder correctly
          touch .nojekyll

          # The dashboard is served from https://projectbluefin.github.io/testsuite/
          # (astro.config.mjs base: '/testsuite/'). The org zone no longer maps
          # qa.projectbluefin.io to this site, so DO NOT write a CNAME: a stale
          # CNAME claims a name that redirects away and 404s on the next deploy.
          
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit
          git add .
          git diff --cached --quiet || git commit -m "chore: deploy Astro QA dashboard to gh-pages [skip ci]"
          
          # Push to the remote gh-pages branch
          git push origin gh-pages