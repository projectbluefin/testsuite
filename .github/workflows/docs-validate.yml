name: Docs validate

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install check dependencies
        run: pip install pyyaml

      - name: Validate docs
        run: python3 scripts/validate_docs.py

      - name: Check skill catalog is in sync
        run: python3 scripts/generate_skill_index.py --check
