name: CI alert

on:
  # The job handles main push metadata only and never checks out code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build test runner image", "Build KDE runner image"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-alert-main
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Get failed jobs from the run
        if: github.event.workflow_run.conclusion != 'success'
        id: jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          JOBS=$(gh api --paginate --slurp "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")
          JOB_COUNT=$(jq '[.[].jobs[]] | length' <<< "$JOBS")
          FAILURES=$(jq -r '[.[].jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "skipped")
                   | "- [\(.name)](\(.html_url)) (\(.conclusion))"] | join("\n")' <<< "$JOBS")
          if [[ "${{ github.event.workflow_run.conclusion }}" == "cancelled" && "$JOB_COUNT" == "0" ]]; then
            echo "Run was cancelled before any job started; nothing was alerted."
          fi
          echo "count=${JOB_COUNT}" >> "$GITHUB_OUTPUT"
          {
            echo "failures<<EOF"
            echo "${FAILURES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for existing alert issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          ISSUE_NUM=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/issues?state=all&per_page=100" \
            | jq -r --arg title "[CI] ${WORKFLOW_NAME} failed on main" '[.[][] | select(.pull_request == null and .title == $title)]
                  | if length > 1 then error("Multiple CI alert issues match; refusing to select one")
                    else .[0].number // empty end')
          echo "issue_number=${ISSUE_NUM:-}" >> "$GITHUB_OUTPUT"

      - name: Create or reopen alert issue
        if: github.event.workflow_run.conclusion != 'success' && (github.event.workflow_run.conclusion != 'cancelled' || steps.jobs.outputs.count != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          FAILURES: ${{ steps.jobs.outputs.failures }}
          EXISTING: ${{ steps.find.outputs.issue_number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail

          RUN_LINK="[${RUN_URL}](${RUN_URL})"

          if [[ -n "${EXISTING}" ]]; then
            echo "Reopening existing alert issue #${EXISTING}"
            gh issue reopen "${EXISTING}" --repo "${{ github.repository }}"
            gh issue edit "${EXISTING}" \
              --repo "${{ github.repository }}" \
              --add-label 'kind/bug' \
              --add-label 'priority/important-soon' \
              --body "## CI alert: ${WORKFLOW_NAME} failed on \`${BRANCH}\`

          Workflow run: ${RUN_LINK}
          Commit: \`${COMMIT}\`

          ### Failed jobs
          ${FAILURES}

          This issue is reopened automatically when the build fails again.
          "
          else
            echo "Creating new alert issue"
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "[CI] ${WORKFLOW_NAME} failed on main" \
              --label 'kind/bug,priority/important-soon' \
              --body "## CI alert: ${WORKFLOW_NAME} failed on \`${BRANCH}\`

          Workflow run: ${RUN_LINK}
          Commit: \`${COMMIT}\`

          ### Failed jobs
          ${FAILURES}

          This issue is reopened automatically when the build fails again.
          "
          fi

      - name: Close alert issue once main is green
        if: github.event.workflow_run.conclusion == 'success' && steps.find.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING: ${{ steps.find.outputs.issue_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          # An older successful run must not close an alert for a newer run.
          # The runner builds are path-filtered, so main HEAD usually moves
          # past the commit they built; compare against this workflow's own
          # finished main runs instead.
          newer=$(gh api --method GET --paginate --slurp \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs" \
            -f branch=main -f status=completed -f per_page=100 |
            jq -r --argjson number "$RUN_NUMBER" \
              '[.[].workflow_runs[] | select((.event == "push" or .event == "schedule") and .run_number > $number)] | max_by(.run_number) | .id // empty')
          if [[ -n "$newer" ]]; then
            echo "A newer main run of ${WORKFLOW_NAME} (${newer}) has finished; leaving the alert to it."
            exit 0
          fi
          state=$(gh issue view "${EXISTING}" --repo "${{ github.repository }}" --json state --jq .state)
          if [[ "${state}" == "OPEN" ]]; then
            gh issue close "${EXISTING}" --repo "${{ github.repository }}" \
              --comment "${WORKFLOW_NAME} is green on main again: ${RUN_URL}"
          fi
