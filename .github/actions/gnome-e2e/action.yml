# gnome-e2e — Composite GitHub Action
#
# Boots a bootc/ostree GNOME image in a KVM-accelerated QEMU VM on a standard
# ubuntu-latest runner, waits for a live Wayland session, and runs a behave
# suite via qecore-headless.
#
# Scope: GUI suites that run inside the VM via qecore-headless (AT-SPI).
#   Supported: smoke, developer, dx, software, vanilla-gnome, extensions, gnomeos-canary
#   NOT supported: lifecycle, security, hardware (need plain-SSH mode — future work)
#
# Requirements:
#   - Runner must have KVM enabled (ubuntu-latest on GHA has it)
#   - OCI image must be a bootc/ostree image (uses bootc install to-disk)
#   - gnome-ponytail-daemon must be baked into the OCI image
#     (suite: extensions checks this and other prerequisites before boot via
#     scripts/guest_preflight.py and records results/guest-provenance.json)
#
# Usage:
#   - uses: projectbluefin/testsuite/.github/actions/gnome-e2e@main
#     with:
#       image: ghcr.io/projectbluefin/dakota:latest
#       suite: smoke
#
# Isolated session (#908 Option A; always on for suite: extensions, opt-in via
# isolated-session for gnomeos-canary): the harness logs in over SSH as
# gnome-e2e-harness, which alone holds the per-run key and sudo. The desktop
# account bluefin-test has GDM autologin only: no SSH key, no sudo, locked
# password. Behave runs as bluefin-test without qecore-headless (which needs
# sudo), so extension and test code get no guest admin access. It requires the
# GNOME OS harness overlay (/opt/gnomeos-harness). Later caller steps reach the
# guest as $GNOME_E2E_SSH_USER.
#
# Candidate extensions (#909; suite: extensions only): extension-artifacts names
# a directory of packed ZIPs. Before the VM boots, scripts/extension_candidates.py
# validates each against its canonical contract and stages it into the desktop
# user's ~/.local/share/gnome-shell/extensions/<uuid>/, so GNOME Shell discovers
# it at startup. The harness compiles its schemas in the guest as that user, the
# run is limited to the staged profiles' collection tags, and the gate requires
# every scenario with those tags to pass. Evidence: results/candidate-provenance.json.
#
# The action writes results to ./results/ and vm-serial.log in the workspace.
# For most suites the caller decides pass/fail from the behave-rc output; for
# suite: extensions the action itself fails the job via the mandatory
# extension-validation gate (scripts/extension_validation.py).
# Artifact upload is deliberately left to the caller workflow.

name: 'GNOME E2E Tests'
description: >
  Run a projectbluefin/testsuite behave suite inside a KVM QEMU VM booting
  a bootc/ostree GNOME image. Supports GUI suites (smoke, developer, dx,
  software, vanilla-gnome, extensions, gnomeos-canary).

inputs:
  image:
    description: 'OCI image to test (e.g. ghcr.io/projectbluefin/dakota:latest)'
    required: true
  suite:
    description: 'Test suite: smoke | developer | dx | software | vanilla-gnome | extensions | gnomeos-canary'
    default: 'smoke'
  testsuite-ref:
    description: >
      projectbluefin/testsuite ref to check out for test content.
      Defaults to the same ref this action was called at, ensuring the test
      content matches the action version. Override to pin to a specific SHA/tag.
    default: ''
  memory:
    description: 'VM RAM in MB'
    default: '4096'
  cpus:
    description: 'VM CPU count'
    default: '4'
  free-disk-space:
    description: 'Run projectbluefin/actions bootc-build/setup-runner to free disk space before provisioning'
    default: 'true'
  isolated-session:
    description: >
      Run the desktop and tests as an account with no SSH key and no sudo,
      driven by a separate harness admin account (#908). Always on for
      suite: extensions. Requires the GNOME OS harness overlay image.
    default: 'false'
  extension-artifacts:
    description: >
      Workspace-relative directory of packed GNOME Shell extension ZIPs to
      stage for the desktop user before GNOME Shell first starts (#909). Each
      archive must match its canonical contract in
      tests/shared/gnome_extensions_artifacts.py and a profile in
      tests/extensions/collection.json. Only for suite: extensions. The run is
      then limited to the staged profiles' tags, and every scenario carrying
      one of those tags must pass.
    default: ''

outputs:
  behave-rc:
    description: >
      Exit code from behave (0 = all passed). Informational: the action
      already fails the job for every suite when behave exits non-zero or no
      scenario passed (extension-validation gate for extensions and
      gnomeos-canary, mandatory-coverage gate via scripts/assert_passed.py
      for all other suites).
    value: ${{ steps.run.outputs.behave_rc }}
  results-path:
    description: 'Workspace-relative path to the results directory'
    value: 'results/'

runs:
  using: composite
  steps:

    # ── Checkout test content ─────────────────────────────────────────────────
    # Match the action repository/ref, including local calls on fork branches.
    # Resolve them in a run step: inside the checkout step itself
    # github.action_repository names actions/checkout, so the checkout fetched
    # testsuite's commit from the wrong repository ("not our ref", canary run
    # 42919533096). A local ./ call has no action repository; fall back to the
    # caller's repository.
    - name: Resolve testsuite source
      id: testsuite-source
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        echo "repository=${ACTION_REPOSITORY:-${GITHUB_REPOSITORY}}" >> "$GITHUB_OUTPUT"
        echo "ref=${ACTION_REF}" >> "$GITHUB_OUTPUT"

    - name: Checkout testsuite
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ steps.testsuite-source.outputs.repository }}
        ref: ${{ inputs.testsuite-ref || steps.testsuite-source.outputs.ref }}
        path: _testsuite
        sparse-checkout: |
          tests/${{ inputs.suite }}
          tests/shared
          tests/__init__.py
          scripts
        sparse-checkout-cone-mode: true

    # ── Free disk space ───────────────────────────────────────────────────────
    # Always runs: it installs QEMU through setup-runner's verified apt cache,
    # so a warm cache needs no Ubuntu mirror (#1155). Disk is freed only when
    # asked; setup-runner skips both freeing steps for any storage backend
    # other than btrfs or remove-software.
    - name: Free disk space and install QEMU
      uses: projectbluefin/actions/bootc-build/setup-runner@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
      with:
        update-podman: "false"
        storage-backend: ${{ inputs.free-disk-space == 'true' && 'btrfs' || 'none' }}
        apt-packages: qemu-system-x86

    # ── KVM access ───────────────────────────────────────────────────────────
    - name: Enable KVM access
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
        ls -la /dev/kvm

    # ── OCI pull (QEMU comes from setup-runner above) ────────────────────────
    - name: Pull OCI image
      shell: bash
      env:
        GNOME_E2E_IMAGE: ${{ inputs.image }}
      run: |
        if [[ "${GNOME_E2E_IMAGE}" == localhost/* ]] && sudo podman image exists "${GNOME_E2E_IMAGE}"; then
          echo "Using locally built image ${GNOME_E2E_IMAGE}"
        else
          sudo podman pull "${GNOME_E2E_IMAGE}"
        fi

    # ── SSH keypair ───────────────────────────────────────────────────────────
    - name: Generate SSH keypair
      shell: bash
      env:
        GNOME_E2E_ISOLATED_INPUT: ${{ inputs.isolated-session }}
        GNOME_E2E_SUITE: ${{ inputs.suite }}
      run: |
        ssh-keygen -t ed25519 -f /tmp/gnome_e2e_key -N "" -C "gnome-e2e@gha"
        echo "GNOME_E2E_PUBKEY=$(cat /tmp/gnome_e2e_key.pub)" >> "$GITHUB_ENV"
        # Extension code must never share an account with the harness (#908).
        if [[ "${GNOME_E2E_ISOLATED_INPUT}" == "true" || "${GNOME_E2E_SUITE}" == "extensions" ]]; then
          echo "GNOME_E2E_ISOLATED=true" >> "$GITHUB_ENV"
          echo "GNOME_E2E_SSH_USER=gnome-e2e-harness" >> "$GITHUB_ENV"
        else
          echo "GNOME_E2E_ISOLATED=false" >> "$GITHUB_ENV"
          echo "GNOME_E2E_SSH_USER=bluefin-test" >> "$GITHUB_ENV"
        fi

    # ── Install OCI image to raw disk and configure for testing ──────────────
    # bootc install to-disk writes the ostree deployment then fails at the
    # bootloader step (bootupd may not be present). We catch that, verify the
    # deployment was written, extract kernel + initramfs for direct QEMU boot,
    # and pre-configure sshd, user accounts, and GDM autologin.
    - name: Install OCI image and configure disk
      shell: bash
      env:
        GNOME_E2E_IMAGE: ${{ inputs.image }}
        GNOME_E2E_SUITE: ${{ inputs.suite }}
        GNOME_E2E_EXTENSION_ARTIFACTS: ${{ inputs.extension-artifacts }}
      run: |
        # Candidate extension code runs only in the extensions suite, which is
        # always the isolated session (#908 Option A).
        if [[ -n "${GNOME_E2E_EXTENSION_ARTIFACTS}" && "${GNOME_E2E_SUITE}" != "extensions" ]]; then
          echo "::error::extension-artifacts is only accepted with suite: extensions"
          exit 1
        fi
        fallocate -l 30G disk.raw

        BOOTC_INSTALL_LOG="$(pwd)/bootc-install.log"
        set +e
        # --pid=host: bootc install refuses to run without it ("This command
        # must be run with the podman --pid=host flag", canary run 42923546804);
        # e2e.yml's install step already passes it.
        sudo podman run \
          --rm --privileged --pid=host \
          --security-opt label=type:unconfined_t \
          -v /var/lib/containers:/var/lib/containers \
          -v /dev:/dev \
          -v "$(pwd):/data" \
          "${GNOME_E2E_IMAGE}" bootc install to-disk \
            --via-loopback /data/disk.raw \
            --filesystem ext4 \
            --wipe \
            --bootloader systemd \
            --karg systemd.firstboot=no \
          2>&1 | tee "${BOOTC_INSTALL_LOG}"
        BOOTC_INSTALL_RC=${PIPESTATUS[0]}
        set -e
        if [[ ${BOOTC_INSTALL_RC} -ne 0 ]]; then
          echo "bootc install exited ${BOOTC_INSTALL_RC}; checking whether deployment was written before continuing"
          echo "bootc install log saved to ${BOOTC_INSTALL_LOG}"
        fi

        LOOP=$(sudo losetup -f --show -P disk.raw)
        echo "Loop: ${LOOP}"
        sudo mkdir -p /mnt/root

        ROOT_PART="${LOOP}p3"
        ROOT_UUID=$(sudo blkid -s UUID -o value "${ROOT_PART}")
        echo "root=${ROOT_PART}  uuid=${ROOT_UUID}"
        sudo mount "${ROOT_PART}" /mnt/root

        DEPLOY=$(sudo find /mnt/root/ostree/deploy/default/deploy/ -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | head -1)
        if [[ -z "${DEPLOY}" ]]; then
          echo "ERROR: ostree deployment missing — bootc install failed before writing layers"
          if [[ ${BOOTC_INSTALL_RC} -ne 0 ]]; then
            echo "bootc install exited ${BOOTC_INSTALL_RC}; full install log:"
            cat "${BOOTC_INSTALL_LOG}"
          fi
          sudo ls -la /mnt/root/ || true
          exit 1
        fi
        if [[ ${BOOTC_INSTALL_RC} -ne 0 ]]; then
          echo "bootc install exited ${BOOTC_INSTALL_RC} after writing deployment ${DEPLOY}; continuing with direct kernel boot"
        fi
        D="/mnt/root/ostree/deploy/default/deploy/${DEPLOY}"
        VAR="/mnt/root/ostree/deploy/default/var"
        KVER=$(ls "${D}/usr/lib/modules/" | head -1)
        echo "deploy=${DEPLOY}  kver=${KVER}"
        echo "GNOME_E2E_ROOT_UUID=${ROOT_UUID}" >> "$GITHUB_ENV"
        echo "GNOME_E2E_KVER=${KVER}" >> "$GITHUB_ENV"

        # Extension-validation lane (#908): record which guest is under test and
        # fail closed before boot when the image lacks a lane prerequisite
        # (stock GNOME OS ships no gnome-ponytail-daemon). Cleanup below still
        # runs; the step fails after it.
        PREFLIGHT_RC=0
        if [[ "${GNOME_E2E_SUITE}" == "extensions" || "${GNOME_E2E_SUITE}" == "gnomeos-canary" ]]; then
          IMAGE_DIGEST=$(sudo podman image inspect --format '{{.Digest}}' "${GNOME_E2E_IMAGE}" 2>/dev/null || true)
          mkdir -p results
          sudo python3 _testsuite/scripts/guest_preflight.py "${D}" \
            --image-ref "${GNOME_E2E_IMAGE}" --image-digest "${IMAGE_DIGEST}" \
            --output results/guest-provenance.json || PREFLIGHT_RC=$?
          sudo chown -R "$(id -u):$(id -g)" results
        fi

        EFI_PART="${LOOP}p2"
        sudo mkdir -p /mnt/efi
        sudo mount "${EFI_PART}" /mnt/efi
        # When bootc's bootloader step failed (bootupd, the expected late
        # failure above) there is no loader/entries directory: find exits
        # non-zero, which under pipefail ended this step silently before the
        # fallback below could run (canary run 42929881520).
        BLS_FILE=$(sudo find /mnt/efi/loader/entries -name '*.conf' 2>/dev/null | head -1 || true)
        if [[ -n "${BLS_FILE}" ]]; then
          BLS_OPTS=$(sudo grep '^options' "${BLS_FILE}" | sed 's/^options //')
        else
          # No BLS entry (bootc's bootloader step failed): find the deployment's
          # real ostree boot entry, as e2e.yml and startup-qualification.yml do.
          # Guessing /ostree/boot.1/default/<hash>/0 left ostree-prepare-root
          # with "Couldn't find specified OSTree root" (canary run 42932368882).
          BOOT_ENTRY=$(sudo find /mnt/root/ostree -maxdepth 4 -type l -name '0' | grep -E '/boot\.[0-9]' | grep '/default/' | head -1 || true)
          if [[ -z "${BOOT_ENTRY}" ]]; then
            BOOT_DIR="/mnt/root/ostree/boot.0/default/${DEPLOY%.*}"
            sudo mkdir -p "${BOOT_DIR}"
            sudo ln -sfT "../../../deploy/default/deploy/${DEPLOY}" "${BOOT_DIR}/${DEPLOY##*.}"
            BOOT_ENTRY="${BOOT_DIR}/${DEPLOY##*.}"
          fi
          OSTREE_PATH="${BOOT_ENTRY#/mnt/root}"
          # ostree-system-generator only parses /ostree/boot.[01]/... (see e2e.yml).
          if [[ "${OSTREE_PATH}" =~ /ostree/(boot\.[0-9]+)\.[0-9]+ ]]; then
            VERSIONED=$(echo "${OSTREE_PATH}" | grep -oE 'boot\.[0-9]+\.[0-9]+')
            [[ -e "/mnt/root/ostree/${BASH_REMATCH[1]}" ]] || sudo ln -s "${VERSIONED}" "/mnt/root/ostree/${BASH_REMATCH[1]}"
            OSTREE_PATH="${OSTREE_PATH/${VERSIONED}/${BASH_REMATCH[1]}}"
          fi
          echo "ostree boot entry: ${OSTREE_PATH}"
          BLS_OPTS="root=UUID=${ROOT_UUID} rw ostree=${OSTREE_PATH} systemd.firstboot=no"
        fi
        GNOME_E2E_KERNEL_ARGS="${BLS_OPTS} console=ttyS0,115200 quiet"
        echo "GNOME_E2E_KERNEL_ARGS=${GNOME_E2E_KERNEL_ARGS}" >> "$GITHUB_ENV"
        sudo umount /mnt/efi

        sudo cp "${D}/usr/lib/modules/${KVER}/vmlinuz" ./vmlinuz
        sudo cp "${D}/usr/lib/modules/${KVER}/initramfs.img" ./initramfs.img
        sudo chown runner:runner ./vmlinuz ./initramfs.img

        sudo mkdir -p "${D}/etc/systemd/system/multi-user.target.wants/"
        # CI VMs are not users: opt out of the daily countme ping
        # (projectbluefin-countme.service honours this marker).
        sudo mkdir -p "${D}/etc/projectbluefin/countme"
        sudo touch "${D}/etc/projectbluefin/countme/disabled"
        sudo ln -sf /usr/lib/systemd/system/sshd.service \
          "${D}/etc/systemd/system/multi-user.target.wants/sshd.service"
        sudo ssh-keygen -A -f "${D}" 2>/dev/null || true

        if [[ "${GNOME_E2E_ISOLATED}" == "true" ]]; then
          # Option A (#908): key and sudo go to a separate harness account;
          # the autologin desktop account gets neither.
          sudo python3 _testsuite/scripts/guest_accounts.py "${D}" "${VAR}" \
            --pubkey /tmp/gnome_e2e_key.pub
          # Native isolated tests need no guest container-management API.
          for unit in podman.socket podman.service; do
            sudo ln -sf /dev/null "${D}/etc/systemd/system/${unit}"
          done
          if [[ -n "${GNOME_E2E_EXTENSION_ARTIFACTS}" ]]; then
            # #909: stage the exact candidate packages into the desktop user's
            # own extension directory before GNOME Shell first starts. Only
            # that account's session loads them; the harness account never
            # does, and nothing in the suite installs anything itself.
            shopt -s nullglob
            CANDIDATES=("${GNOME_E2E_EXTENSION_ARTIFACTS}"/*.zip)
            shopt -u nullglob
            if [[ ${#CANDIDATES[@]} -eq 0 ]]; then
              echo "::error::extension-artifacts directory ${GNOME_E2E_EXTENSION_ARTIFACTS} holds no .zip"
              exit 1
            fi
            mkdir -p results
            sudo python3 _testsuite/scripts/extension_candidates.py stage \
              --home "${VAR}/home/bluefin-test" \
              --provenance results/candidate-provenance.json \
              --github-env "${GITHUB_ENV}" "${CANDIDATES[@]}"
            sudo chown -R "$(id -u):$(id -g)" results
          fi
        else
          BFT_UID=1001
          if ! sudo grep -q '^bluefin-test:' "${D}/etc/passwd" 2>/dev/null; then
            printf 'bluefin-test:x:%d:%d:Bluefin Test:/var/home/bluefin-test:/bin/bash\n' \
              "${BFT_UID}" "${BFT_UID}" | sudo tee -a "${D}/etc/passwd"
            printf 'bluefin-test:!:19000:0:99999:7:::\n' | sudo tee -a "${D}/etc/shadow"
            printf 'bluefin-test:x:%d:\n' "${BFT_UID}" | sudo tee -a "${D}/etc/group"
          fi

          sudo mkdir -p "${VAR}/home/bluefin-test/.ssh"
          sudo tee "${VAR}/home/bluefin-test/.ssh/authorized_keys" < /tmp/gnome_e2e_key.pub
          sudo chown -R "${BFT_UID}:${BFT_UID}" "${VAR}/home/bluefin-test"
          sudo chmod 700 "${VAR}/home/bluefin-test/.ssh"
          sudo chmod 600 "${VAR}/home/bluefin-test/.ssh/authorized_keys"

          sudo mkdir -p "${D}/etc/ssh/sshd_config.d/"
          echo 'PermitUserEnvironment yes' | \
            sudo tee "${D}/etc/ssh/sshd_config.d/99-bluefin-test.conf"

          echo 'bluefin-test ALL=(ALL) NOPASSWD:ALL' | \
            sudo tee "${D}/etc/sudoers.d/zz-bluefin-test"
          sudo chmod 440 "${D}/etc/sudoers.d/zz-bluefin-test"
        fi

        sudo mkdir -p "${D}/etc/gdm"
        printf '[daemon]\nAutomaticLoginEnable=True\nAutomaticLogin=bluefin-test\n' | \
          sudo tee "${D}/etc/gdm/custom.conf"

        for svc in bluetooth cups avahi-daemon ModemManager fwupd colord; do
          sudo ln -sf /dev/null "${D}/etc/systemd/system/${svc}.service" 2>/dev/null || true
        done

        sudo umount /mnt/root
        sudo losetup -d "${LOOP}"
        sudo podman rmi "${GNOME_E2E_IMAGE}" 2>/dev/null || true
        ls -lh disk.raw vmlinuz initramfs.img
        df -h .
        if [[ ${PREFLIGHT_RC} -ne 0 ]]; then
          echo "::error::Guest preflight failed (rc=${PREFLIGHT_RC}); see results/guest-provenance.json"
          exit 1
        fi

    # ── Boot VM ───────────────────────────────────────────────────────────────
    - name: Boot VM with QEMU + KVM
      shell: bash
      run: |
        touch "$(pwd)/vm-serial.log"
        chmod 666 "$(pwd)/vm-serial.log"

        sudo qemu-system-x86_64 \
          -machine  q35,accel=kvm \
          -cpu      host \
          -m        ${{ inputs.memory }} \
          -smp      ${{ inputs.cpus }} \
          -kernel   ./vmlinuz \
          -initrd   ./initramfs.img \
          -append   "${GNOME_E2E_KERNEL_ARGS}" \
          -object   iothread,id=ioth0 \
          -drive    if=none,id=disk,file=disk.raw,format=raw,cache=unsafe,aio=threads,discard=unmap \
          -device   virtio-blk-pci,drive=disk,iothread=ioth0 \
          -netdev   user,id=net0,hostfwd=tcp::2222-:22 \
          -device   virtio-net-pci,netdev=net0 \
          -device   virtio-gpu-pci \
          -display  none \
          -serial   file:$(pwd)/vm-serial.log \
          -daemonize \
          -pidfile  /tmp/gnome_e2e_qemu.pid
        echo "VM booting (pid=$(sudo cat /tmp/gnome_e2e_qemu.pid))"

    # ── Wait for SSH ──────────────────────────────────────────────────────────
    - name: Wait for SSH
      shell: bash
      run: |
        SSH_OPTS="-i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=/tmp/gnome-e2e-ssh-%C -o ConnectTimeout=3"
        DEADLINE=$((SECONDS + 300))
        while [ $SECONDS -lt $DEADLINE ]; do
          if ssh ${SSH_OPTS} -p 2222 ${GNOME_E2E_SSH_USER}@127.0.0.1 "echo up" 2>/dev/null; then
            echo "SSH ready after ${SECONDS}s"
            exit 0
          fi
          sleep 3
        done
        echo "ERROR: SSH never became ready after 5 minutes"
        exit 1

    # ── Dump VM serial log (always — primary boot debug output) ──────────────
    - name: Dump VM serial log
      if: always()
      shell: bash
      run: |
        echo "=== VM serial console output ==="
        cat "$(pwd)/vm-serial.log" 2>/dev/null || echo "(no serial log)"

    # ── Wait for live GNOME session ───────────────────────────────────────────
    - name: Wait for GNOME session
      shell: bash
      run: |
        SSH_OPTS="-i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=/tmp/gnome-e2e-ssh-%C -o ConnectTimeout=3"
        SSH="ssh ${SSH_OPTS} -p 2222 ${GNOME_E2E_SSH_USER}@127.0.0.1"
        # The isolated harness account cannot read the desktop user's runtime dir.
        GUEST_SUDO=""
        [[ "${GNOME_E2E_ISOLATED}" == "true" ]] && GUEST_SUDO="sudo "
        DEADLINE=$((SECONDS + 180))
        while [ $SECONDS -lt $DEADLINE ]; do
          if $SSH "${GUEST_SUDO}test -S /run/user/1001/wayland-0" 2>/dev/null; then
            echo "GNOME session active after ${SECONDS}s"
            exit 0
          fi
          sleep 3
        done
        echo "ERROR: GNOME session did not start within 3 minutes"
        $SSH "${GUEST_SUDO}journalctl -u gdm --no-pager -n 50" 2>/dev/null || true
        exit 1

    # ── Install Python test stack inside the VM ───────────────────────────────
    # gnome-ponytail-daemon must already be in the OCI image (no dnf/rpm in dakota).
    # qecore-headless manages the ponytail daemon lifecycle — do not pre-start it.
    - name: Install Python test stack
      shell: bash
      env:
        GNOME_E2E_SUITE: ${{ inputs.suite }}
      run: |
        SSH_OPTS="-i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=/tmp/gnome-e2e-ssh-%C -o ConnectTimeout=3"
        SSH="ssh ${SSH_OPTS} -p 2222 ${GNOME_E2E_SSH_USER}@127.0.0.1"

        if [[ "${GNOME_E2E_ISOLATED}" == "true" ]]; then
          # Option A (#908): the overlay's tools run as the desktop user; the
          # harness account only prepares devices and proves the isolation.
          $SSH "test -x /opt/gnomeos-harness/bin/behave && test -x /opt/gnomeos-harness/bin/python3" || {
            echo "::error::Isolated session needs the GNOME OS harness overlay (/opt/gnomeos-harness); build it with scripts/build-gnomeos-harness.sh"
            exit 1
          }
          $SSH "sudo modprobe uinput 2>/dev/null || true"
          $SSH "sudo chmod 0666 /dev/uinput 2>/dev/null || true"
          # The checker runs as root from the harness home, which the desktop
          # user cannot write. Its report stays outside results/, which the
          # guest session fills.
          $SSH 'mkdir -p "$HOME/gnome_e2e_admin"'
          scp -i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ControlPath=/tmp/gnome-e2e-ssh-%C -P 2222 \
            _testsuite/scripts/guest_session_isolation.py \
            "${GNOME_E2E_SSH_USER}@127.0.0.1:gnome_e2e_admin/"
          ISOLATION_RC=0
          $SSH 'sudo /opt/gnomeos-harness/bin/python3 "$HOME/gnome_e2e_admin/guest_session_isolation.py"' \
            > session-isolation.json || ISOLATION_RC=$?
          cat session-isolation.json
          if [[ ${ISOLATION_RC} -ne 0 ]]; then
            echo "::error::Desktop session is not isolated from harness administration; see session-isolation.json"
            exit 1
          fi
          # qecore-headless (not used here) normally switches this on.
          DESKTOP_GSETTINGS="sudo -u bluefin-test env XDG_RUNTIME_DIR=/run/user/1001 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus gsettings set"
          $SSH "${DESKTOP_GSETTINGS} org.gnome.desktop.interface toolkit-accessibility true" \
            || echo "::warning::could not enable toolkit accessibility for bluefin-test"
          # No first-login welcome dialog over the overview in the test session.
          $SSH "${DESKTOP_GSETTINGS} org.gnome.shell welcome-dialog-last-shown-version '999'" \
            || echo "::warning::could not mark the welcome dialog as shown for bluefin-test"
          # Staged candidates (#909): compile each package's schemas with the
          # guest's own GLib, as the desktop user, as gnome-extensions install
          # does. The test login below is the first to use them.
          for uuid in ${GNOME_E2E_STAGED_UUIDS:-}; do
            schemas="/var/home/bluefin-test/.local/share/gnome-shell/extensions/${uuid}/schemas"
            $SSH "sudo -u bluefin-test -H -- sh -c 'test ! -d ${schemas} || glib-compile-schemas --strict ${schemas}'" || {
              echo "::error::could not compile the GSettings schemas staged for ${uuid}"
              exit 1
            }
          done
          # Restart GDM, as qecore-headless does in shared mode, so tests run in
          # a second login: accessibility on from shell start, first-login
          # setup finished. In the first boot session the shell held a
          # system-modal dialog with its "Skip" button focused (modal 2,
          # actionMode SYSTEM_MODAL; diag run 43543636641): the canary's
          # Escape closed that dialog instead of the overview, and the
          # overview then hid the window from the virtual clicks. Restart plus
          # settle passed (diag run 43543641291); a settle alone (43543638989)
          # or the full gnome-session environment (43543643241) did not.
          $SSH "sudo systemctl stop gdm"
          # test exits 1 once the socket is gone; an SSH failure (255) is not
          # proof the session stopped, so retry it a bounded number of times.
          DEADLINE=$((SECONDS + 60))
          SSH_FAILURES=0
          while true; do
            SOCKET_RC=0
            $SSH "sudo test -S /run/user/1001/wayland-0" 2>/dev/null || SOCKET_RC=$?
            if [[ ${SOCKET_RC} -eq 1 ]]; then
              break
            elif [[ ${SOCKET_RC} -ne 0 ]]; then
              SSH_FAILURES=$((SSH_FAILURES + 1))
              if [[ ${SSH_FAILURES} -ge 5 ]]; then
                echo "::error::could not reach the guest over SSH to confirm the first GNOME session stopped (rc=${SOCKET_RC})"
                exit 1
              fi
            fi
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "::error::first GNOME session did not stop within 60s of stopping GDM"
              exit 1
            fi
            sleep 2
          done
          $SSH "sudo systemctl start gdm"
          DEADLINE=$((SECONDS + 180))
          until $SSH "sudo test -S /run/user/1001/wayland-0" 2>/dev/null; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "::error::GNOME session did not come back within 3 minutes of restarting GDM"
              $SSH "sudo journalctl -u gdm --no-pager -n 50" 2>/dev/null || true
              exit 1
            fi
            sleep 3
          done
          # The socket appears before the shell finishes starting up. A settle
          # wait alone did not fix the first session (diag run 43543638989);
          # restart plus this settle passed (diag run 43543641291).
          sleep 15
          echo "GNOME session restarted for the isolated desktop user"
          # Evidence that the restarted Shell discovered each staged candidate
          # from the desktop user's directory (it is not enabled yet).
          mkdir -p results
          for uuid in ${GNOME_E2E_STAGED_UUIDS:-}; do
            $SSH "sudo -u bluefin-test env XDG_RUNTIME_DIR=/run/user/1001 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus gnome-extensions info ${uuid}" \
              >> results/candidate-discovery.txt 2>&1 \
              || echo "::warning::GNOME Shell does not report staged extension ${uuid}"
          done
          exit 0
        fi

        if [[ "${GNOME_E2E_SUITE}" == "gnomeos-canary" ]]; then
          $SSH "test -x /opt/gnomeos-harness/bin/qecore-headless"
          # Native GNOME OS overlay already built its C extensions against the
          # matching devel image. Do not pip-build them again on the runtime OS.
          $SSH 'mkdir -p "$HOME/.local/bin"; for f in /opt/gnomeos-harness/bin/*; do ln -sf "$f" "$HOME/.local/bin/$(basename "$f")"; done'
        else
          $SSH "python3 -m ensurepip --user 2>/dev/null || true"
          # Pin to the same qecore the runner image (container/Containerfile.runner)
          # ships — smoke/environment.py monkeypatches qecore.utility internals
          # (_get_uinput_device, >= 4.19), so runner/VM drift kills keyboard input
          # silently (testsuite#820-class failure).
          $SSH "python3 -m pip install -q --user qecore==4.19.3 behave==1.3.3 dogtail==2.0.3 python-uinput==1.0.1"
          $SSH "for f in \$HOME/.local/bin/qecore_*; do sudo ln -sf \"\$f\" /usr/local/bin/\$(basename \"\$f\") 2>/dev/null; done"
        fi
        $SSH "sudo modprobe uinput 2>/dev/null || true"
        $SSH "sudo chmod 0666 /dev/uinput 2>/dev/null || true"

        $SSH "
          XDG=/run/user/1001
          SESSION_BUS=\$(systemctl --user show-environment 2>/dev/null \
            | grep '^DBUS_SESSION_BUS_ADDRESS=' | head -1 | cut -d= -f2-)
          [[ -z \"\${SESSION_BUS}\" ]] && SESSION_BUS=\"unix:path=\${XDG}/bus\"
          WAYLAND_DISP=\$(ls /run/user/1001/wayland-* 2>/dev/null \
            | head -1 | xargs basename 2>/dev/null || echo wayland-0)
          # Query the real AT-SPI accessibility bus address (separate socket from session bus).
          ATSPI_ADDR=\"\"
          for _i in 1 2 3 4 5; do
            ATSPI_ADDR=\$(DBUS_SESSION_BUS_ADDRESS=\"\${SESSION_BUS}\" \
              gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
              --method org.a11y.Bus.GetAddress 2>/dev/null \
              | sed \"s/.*'\\(unix:[^']*\\)'.*/\\1/\")
            [[ -n \"\${ATSPI_ADDR}\" ]] && break
            sleep 2
          done
          if [[ -z \"\${ATSPI_ADDR}\" ]]; then
            echo 'WARNING: Could not query AT-SPI bus address; falling back to session bus'
            ATSPI_ADDR=\"\${SESSION_BUS}\"
          else
            echo \"AT-SPI bus address: \${ATSPI_ADDR}\"
          fi
          printf 'export DBUS_SESSION_BUS_ADDRESS=%s\nexport WAYLAND_DISPLAY=%s\nexport XDG_RUNTIME_DIR=%s\nexport AT_SPI_BUS_ADDRESS=%s\n' \
            \"\${SESSION_BUS}\" \"\${WAYLAND_DISP}\" \"\${XDG}\" \"\${ATSPI_ADDR}\" \
            > /tmp/gnome_e2e_session.env
          cat /tmp/gnome_e2e_session.env
        "

    # ── Copy testsuite and run behave ────────────────────────────────────────
    - name: Run behave via qecore-headless
      id: run
      shell: bash
      env:
        GNOME_E2E_SUITE: ${{ inputs.suite }}
      run: |
        SSH_OPTS="-i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ControlMaster=auto -o ControlPersist=600 -o ControlPath=/tmp/gnome-e2e-ssh-%C -o ConnectTimeout=3"
        SSH="ssh ${SSH_OPTS} -p 2222 ${GNOME_E2E_SSH_USER}@127.0.0.1"
        SCP="scp -i /tmp/gnome_e2e_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlPath=/tmp/gnome-e2e-ssh-%C -P 2222 -r"
        mkdir -p results

        BEHAVE_RC=0
        if [[ "${GNOME_E2E_ISOLATED}" == "true" ]]; then
          # A fresh directory: mkdir without -p fails if the desktop session
          # already put anything, even a symlink, at this name.
          $SSH "mkdir -m 0755 /tmp/gnome_e2e && mkdir /tmp/gnome_e2e/tests /tmp/gnome_e2e/results"
          $SCP "_testsuite/tests/${GNOME_E2E_SUITE}" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/tests/"
          $SCP "_testsuite/tests/shared" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/tests/"
          $SCP "_testsuite/tests/__init__.py" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/tests/__init__.py"
          $SCP "_testsuite/scripts/gnomeos_canary_behave.py" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/"
          $SSH "sudo chown -hR bluefin-test:bluefin-test /tmp/gnome_e2e"
          BEHAVE_USERDATA=""
          [[ "${GNOME_E2E_SUITE}" == "extensions" ]] && BEHAVE_USERDATA="-D disposable_guest=true"
          # Staged candidates (#909) run only their own profiles' scenarios.
          # The tags come from collection.json, checked as [a-z0-9_]+.
          [[ -n "${GNOME_E2E_BEHAVE_TAGS:-}" ]] && BEHAVE_USERDATA="${BEHAVE_USERDATA} --tags '${GNOME_E2E_BEHAVE_TAGS}'"
          # Behave runs as the desktop user with a clean environment and no
          # qecore-headless (it needs sudo). The wrapper reads the live
          # session's display, session bus and accessibility bus itself.
          $SSH "sudo -u bluefin-test -H -- env -i HOME=/var/home/bluefin-test USER=bluefin-test LOGNAME=bluefin-test LANG=C.UTF-8 \
            PATH=/opt/gnomeos-harness/bin:/usr/bin:/bin PYTHONPATH=/tmp/gnome_e2e \
            /opt/gnomeos-harness/bin/python3 /tmp/gnome_e2e/gnomeos_canary_behave.py /opt/gnomeos-harness/bin/behave \
            /tmp/gnome_e2e/tests/${GNOME_E2E_SUITE}/features/ ${BEHAVE_USERDATA} \
            --format json.pretty --outfile /tmp/gnome_e2e/results/results.json \
            --format pretty --outfile /tmp/gnome_e2e/results/results.txt --format progress --no-capture" \
            || BEHAVE_RC=$?
        else
          # Copy tests/ tree preserving structure so tests.shared imports resolve.
          # Copy tests/__init__.py too: without it the guest's tests/ is only a
          # namespace package and another tests package on the path shadows it.
          $SSH "mkdir -p /tmp/gnome_e2e/tests /tmp/gnome_e2e/results"
          $SCP "_testsuite/tests/${GNOME_E2E_SUITE}" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/tests/"
          [[ -d "_testsuite/tests/shared" ]] && \
            $SCP "_testsuite/tests/shared" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/tests/" || true
          [[ -f "_testsuite/tests/__init__.py" ]] && \
            $SCP "_testsuite/tests/__init__.py" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/tests/__init__.py" || true

          # GNOME OS ships a read-only /usr. qecore-headless rewrites the GNOME
          # Shell unit for --unsafe-mode and, failing to write /usr, falls back to
          # the writable /etc/systemd/user/. Ensure that directory exists so the
          # fallback lands instead of the run aborting before any scenario.
          $SSH "sudo mkdir -p /etc/systemd/user"

          HEADLESS_FLAGS=""
          BEHAVE_PREFIX=""
          if [[ "${GNOME_E2E_SUITE}" == "gnomeos-canary" ]]; then
            HEADLESS_FLAGS="--dont-kill"
            # qecore-headless replaces its environment with the first
            # gnome-session's environ, which has no WAYLAND_DISPLAY or session
            # bus (#1144). The wrapper reads them after qecore's GDM restart and
            # execs behave. qecore needs the script's first word to be an
            # executable, so call it through the harness Python checked above.
            $SCP "_testsuite/scripts/gnomeos_canary_behave.py" "${GNOME_E2E_SSH_USER}@127.0.0.1:/tmp/gnome_e2e/"
            BEHAVE_PREFIX="/opt/gnomeos-harness/bin/python3 /tmp/gnome_e2e/gnomeos_canary_behave.py "
          fi
          BEHAVE_RC=0
          $SSH "
            set -e
            source /tmp/gnome_e2e_session.env
            export PATH=\$HOME/.local/bin:\$PATH
            export PYTHONPATH=/tmp/gnome_e2e
            BEHAVE_BIN=\$(which behave)
            \$HOME/.local/bin/qecore-headless ${HEADLESS_FLAGS} \"${BEHAVE_PREFIX}\$BEHAVE_BIN /tmp/gnome_e2e/tests/${GNOME_E2E_SUITE}/features/ --format json.pretty --outfile /tmp/gnome_e2e/results/results.json --format pretty --outfile /tmp/gnome_e2e/results/results.txt --format progress --no-capture\"
          " || BEHAVE_RC=$?
        fi

        # The guest's results/ is writable by the desktop (and, for extensions,
        # candidate) code, so treat it as untrusted: copy regular files only
        # (no symlinks, FIFOs or devices that could hang or redirect the copy),
        # bound the copy in time, unpack into an empty staging directory, and
        # merge without overwriting anything the harness already wrote here
        # (guest-provenance.json, the canary's harness-*.json).
        GUEST_RESULTS=$(mktemp -d)
        timeout 300 $SSH "cd /tmp/gnome_e2e/results 2>/dev/null && find . -type f -print0 | tar --create --null --no-recursion --files-from=- --file=-" \
          | timeout 300 tar --extract --file=- --directory="${GUEST_RESULTS}" --no-same-owner --no-same-permissions \
          || echo "::warning::copying guest results was incomplete"
        mkdir -p results
        cp -R --update=none --no-preserve=all "${GUEST_RESULTS}/." results/
        rm -rf "${GUEST_RESULTS}"
        echo "behave_rc=${BEHAVE_RC}" >> "$GITHUB_OUTPUT"

    # ── Summarise results to CI log + job summary ─────────────────────────────
    # Scenario counting and the pass/fail headline come from
    # scripts/e2e_summary.py — the copy covered by
    # tests/unit/test_e2e_summary.py — imported from the _testsuite checkout
    # above (its sparse checkout includes scripts/). Restating the logic here
    # is what let an all-undefined/all-untested run render a green headline
    # (#797), so this step must keep consuming the tested implementation.
    # Only the SLA block below is genuinely action-specific.
    - name: Summarise results
      if: always()
      shell: bash
      env:
        GNOME_E2E_SUITE: ${{ inputs.suite }}
      run: |
        python3 - <<'PYEOF'
        import importlib.util
        import json, os, sys
        from pathlib import Path

        results_file = Path("results/results.json")
        timings_file = Path("results/timings.jsonl")
        suite        = os.environ.get("GNOME_E2E_SUITE", "smoke")

        if not results_file.exists():
            print("No results.json found — summary unavailable", flush=True)
            sys.exit(0)

        # Single source of truth for what "passed" means: the unit-tested
        # scripts/e2e_summary.py, checked out into _testsuite by this action.
        # Load it by file path instead of `import scripts.e2e_summary`: this
        # action runs in arbitrary consumer workspaces, and a regular
        # `scripts/` package there (one with __init__.py) wins over the
        # checkout's namespace package regardless of sys.path order.
        module_path = Path("_testsuite/scripts/e2e_summary.py").resolve()
        try:
            spec = importlib.util.spec_from_file_location("e2e_summary", module_path)
            if spec is None or spec.loader is None:
                raise ImportError(f"no loader for {module_path}")
            e2e_summary = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(e2e_summary)
            count_scenarios = e2e_summary.count_scenarios
            is_success      = e2e_summary.is_success
            summary_icon    = e2e_summary.summary_icon
            load_report     = e2e_summary.load_report
            error_text      = e2e_summary.error_text
        except Exception as exc:
            # Fail closed rather than render a headline we cannot justify, and
            # catch broadly on purpose: exec_module runs the module's top level,
            # so a corrupted or incompatible e2e_summary.py can raise anything
            # (SyntaxError included). This step is reporting-only and runs with
            # `if: always()`; letting an exception escape would exit non-zero and
            # fail the consumer's job over a summary we simply could not render.
            print(
                f"ERROR: cannot import scripts.e2e_summary: "
                f"{type(exc).__name__}: {exc}",
                flush=True,
            )
            summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
            if summary_file:
                with open(summary_file, "a") as fh:
                    fh.write(
                        f"## ⚠️ E2E Results — `{suite}`\n\n"
                        "Summary unavailable: `scripts/e2e_summary.py` could not "
                        "be loaded from the testsuite checkout.\n"
                    )
            sys.exit(0)

        # load_report tolerates a results.json left truncated by a mid-run
        # crash (behave writes the closing ']' only in close()): it salvages
        # the complete feature objects instead of raising and failing the job.
        # `complete` is False for a salvaged file, and such a run is never
        # PASSED: the feature that was running when the lane died is the one
        # the salvage drops.
        data, complete = load_report(results_file.read_text())

        counts = count_scenarios(data)
        passed = counts["passed"]
        failed = counts["failed"]
        skipped = counts["skipped"]
        total = sum(counts.values())

        failures = []
        for feature in data:
            feature_name = feature.get("name", "unknown feature")
            for element in feature.get("elements", []):
                if element.get("type") != "scenario":
                    continue
                if element.get("status") != "failed":
                    continue
                scenario_name = element.get("name", "")
                failed_step = error_msg = ""
                for step in element.get("steps", []):
                    result = step.get("result", {})
                    if result.get("status") == "failed":
                        failed_step = step.get("name", "")
                        error_msg  = error_text(result.get("error_message"))
                        break
                failures.append((feature_name, scenario_name, failed_step, error_msg))

        sla_violations = []
        if timings_file.exists():
            for line in timings_file.read_text().splitlines():
                try:
                    entry = json.loads(line)
                    if entry.get("sla_violated") and entry.get("status") != "skipped":
                        sla_violations.append(entry)
                except Exception:
                    pass

        # ── Compact summary in CI log ──────────────────────────────────────
        # PASSED only when is_success holds on a complete results.json: an
        # undefined-only, untested-only, errored, empty or truncated run is
        # INCOMPLETE, never PASSED (failed == 0 is not enough).
        if failed:
            status_word = "FAILED"
        elif complete and is_success(counts):
            status_word = "PASSED"
        else:
            status_word = "INCOMPLETE"
        sep = "=" * 64
        print(f"\n{sep}", flush=True)
        print(
            f"E2E {status_word}: {passed} passed / {failed} failed / "
            f"{skipped} skipped / {counts['undefined']} undefined / "
            f"{counts['untested']} untested / {counts['other']} error-other "
            f"(total {total})",
            flush=True,
        )
        if not complete:
            print(
                "WARNING: results.json was truncated (the lane crashed mid-run); "
                "counts cover only the features that finished.",
                flush=True,
            )

        if failures:
            print("\nFailed scenarios:", flush=True)
            for feat, scen, step, err in failures:
                print(f"  ❌  [{feat}] {scen}", flush=True)
                if step:
                    print(f"       step : {step}", flush=True)
                if err:
                    first_line = err.split("\n")[0][:200]
                    print(f"       error: {first_line}", flush=True)

        if sla_violations:
            print("\nSLA violations:", flush=True)
            for v in sla_violations:
                print(f"  ⚠️   {v['scenario']}: {v['elapsed_s']:.1f}s (SLA {v['sla_s']}s)", flush=True)

        print(f"{sep}\n", flush=True)

        # ── GitHub job summary ─────────────────────────────────────────────
        summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
        if not summary_file:
            sys.exit(0)

        # ✅ only on a clean run, ❌ on any failure, ⚠️ for undefined/untested/
        # errored scenarios — the same rule as the CI-log headline above.
        icon  = summary_icon(counts)
        if not complete and icon == "✅":
            icon = "⚠️"
        lines = [f"## {icon} E2E Results — `{suite}`", ""]
        if not complete:
            lines += [
                "**⚠️ INCOMPLETE (results truncated):** `results.json` was cut "
                "off by a mid-run crash; counts cover only the features that "
                "finished.",
                "",
            ]
        lines += [
            "| ✅ Passed | ❌ Failed | ⏭️ Skipped | ⚠️ Undefined | ⚪ Untested | 🛑 Error/other | Total |",
            "|----------|----------|-----------|-------------|-----------|---------------|-------|",
            f"| {passed} | **{failed}** | {skipped} | {counts['undefined']} | "
            f"{counts['untested']} | {counts['other']} | {total} |",
            "",
        ]

        if failures:
            lines += ["### ❌ Failures", "",
                      "| Feature | Scenario | Failed Step | Error |",
                      "|---------|----------|-------------|-------|"]
            for feat, scen, step, err in failures:
                first_line = (err.split("\n")[0] if err else "")[:150]
                first_line = first_line.replace("|", "\\|").replace("`", "'")
                lines.append(f"| {feat} | {scen} | `{step}` | {first_line} |")
            lines.append("")

        if sla_violations:
            lines += ["### ⚠️ SLA Violations", "",
                      "| Scenario | Duration | SLA |",
                      "|----------|----------|-----|"]
            for v in sla_violations:
                lines.append(f"| {v['scenario']} | {v['elapsed_s']:.1f}s | {v['sla_s']}s |")
            lines.append("")

        with open(summary_file, "a") as fh:
            fh.write("\n".join(lines) + "\n")
        PYEOF

    # ── Extension-validation gate (mandatory service gate) ────────────────────
    # Issue #908 acceptance: an extension-validation run passes only when at
    # least one scenario genuinely passed and nothing errored. The summarise
    # step above renders scripts/e2e_summary.py, which deliberately scores an
    # empty or all-skipped run green (whole suites legitimately ship only
    # @future) — the wrong verdict for this lane, where all-skipped means the
    # extensions never loaded. scripts/extension_validation.py (added in #916)
    # fails closed for empty / all-skipped / undefined / untested / hook-error
    # / failed-boot / missing-result runs; this step makes it the lane verdict.
    # Runs even when behave failed (if: always()) so a crashed lane that left
    # no results.json still fails the gate instead of slipping through on the
    # run step's exit code alone. The GNOME OS baseline also uses this strict
    # gate; every other suite keeps the e2e_summary headline.
    - name: Gate extension-validation run
      if: always() && (inputs.suite == 'extensions' || inputs.suite == 'gnomeos-canary')
      shell: bash
      env:
        GNOME_E2E_BEHAVE_RC: ${{ steps.run.outputs.behave_rc }}
      run: |
        GATE="_testsuite/scripts/extension_validation.py"
        if [[ ! -f "${GATE}" ]]; then
          echo "::error::Extension-validation gate script missing: ${GATE} not in the testsuite checkout (needs PR #916). Failing closed."
          exit 1
        fi
        # Staged candidates (#909): every scenario with their tags must pass.
        REQUIRED=()
        for tag in ${GNOME_E2E_REQUIRED_TAGS:-}; do
          REQUIRED+=(--require-tag "${tag}")
        done
        python3 "${GATE}" results/results.json "${REQUIRED[@]}"
        # A wrapper/after_all failure can leave passing scenario records. Both
        # the complete result gate and the actual process must succeed.
        if [[ "${GNOME_E2E_BEHAVE_RC}" != "0" ]]; then
          echo "::error::qecore/Behave did not exit successfully (${GNOME_E2E_BEHAVE_RC:-missing exit code})"
          exit 1
        fi

    # ── Mandatory-coverage gate (every other suite) ───────────────────────────
    # The run step records behave's exit code without failing, and the
    # summarise step only renders a headline, so without this gate a lane that
    # executed nothing (missing/empty/truncated results.json, setup failure,
    # zero passing scenarios) finished green. scripts/assert_passed.py is the
    # same verdict contract e2e.yml uses for its desktop suites.
    - name: Gate suite has passing scenarios
      if: always() && inputs.suite != 'extensions' && inputs.suite != 'gnomeos-canary'
      shell: bash
      env:
        GNOME_E2E_BEHAVE_RC: ${{ steps.run.outputs.behave_rc }}
      run: |
        GATE="_testsuite/scripts/assert_passed.py"
        if [[ ! -f "${GATE}" ]]; then
          echo "::error::Mandatory-coverage gate script missing: ${GATE} not in the testsuite checkout. Failing closed."
          exit 1
        fi
        python3 "${GATE}" results/results.json
        if [[ "${GNOME_E2E_BEHAVE_RC}" != "0" ]]; then
          echo "::error::qecore/Behave did not exit successfully (${GNOME_E2E_BEHAVE_RC:-missing exit code})"
          exit 1
        fi
